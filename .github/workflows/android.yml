name: Build Android APK

# Builds an installable debug APK on GitHub's servers (which have the Android
# SDK), so no local Android tooling is needed. The finished APK is uploaded as
# a downloadable artifact on every run, and attached to a Release when you push
# a tag like v1.0.0.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/BalanceBoard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalanceBoard-apk
          path: out/BalanceBoard.apk
          if-no-files-found: error

      - name: Attach APK to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/BalanceBoard.apk
