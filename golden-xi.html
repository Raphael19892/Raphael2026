<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1220" />
<title>Golden XI</title>
<style>
  :root{
    --bg:#0b1220; --panel:#141d30; --panel2:#1b2640; --line:#24324f;
    --txt:#e8eefc; --mut:#8a97b5; --acc:#f5c542; --grn:#2ecc71; --red:#ff5a5f; --blu:#4da3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{max-width:560px;margin:0 auto;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
  .logo{font-weight:900;font-size:19px;letter-spacing:.5px}
  .logo span{color:var(--acc)}
  .coins{background:#2a2410;color:var(--acc);padding:6px 12px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}
  main{padding:16px;padding-bottom:96px}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;z-index:5;
    background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:12px;
    display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button .i{font-size:21px;line-height:1}
  nav button.on{color:var(--acc)}
  h2{margin:4px 0 12px;font-size:20px}
  h3{margin:0 0 10px;font-size:16px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px}
  .sp{justify-content:space-between}
  .mut{color:var(--mut);font-size:13px}
  .btn{background:var(--acc);color:#1d1600;border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px}
  .btn.big{width:100%;padding:15px;font-size:17px}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.4;cursor:default}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 12px;font-size:13px}
  .chip.on{background:var(--acc);color:#1d1600;border-color:var(--acc);font-weight:700}
  .stat{flex:1;background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat small{color:var(--mut)}
  .bar{height:8px;background:#0e1628;border-radius:9px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blu),var(--grn))}
  .form{display:flex;gap:4px}
  .form span{width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:800;display:grid;place-items:center;color:#fff}
  .W{background:var(--grn)} .D{background:#7f8c8d} .L{background:var(--red)}

  /* Player cards */
  .card{width:78px;height:106px;border-radius:11px;position:relative;flex:none;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:6px 4px 9px;color:#22180a;font-weight:800;
    box-shadow:0 4px 12px rgba(0,0,0,.45);overflow:hidden}
  .card .ct{width:100%;display:flex;justify-content:space-between;align-items:flex-start;padding:0 3px;direction:ltr}
  .card .ct b{font-size:20px;line-height:1}
  .card .ct small{font-size:10px;margin-top:2px}
  .card .fl{font-size:28px;line-height:1}
  .card .nm{font-size:11px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
  .card .clb{position:absolute;bottom:0;left:0;right:0;height:5px}
  .card.sm{width:56px;height:76px;padding:4px 2px 7px;border-radius:9px}
  .card.sm .ct b{font-size:15px} .card.sm .ct small{font-size:8px}
  .card.sm .fl{font-size:19px} .card.sm .nm{font-size:9px}
  .t-bronze{background:linear-gradient(160deg,#eab27a,#8a5a2b)}
  .t-silver{background:linear-gradient(160deg,#f3f6f9,#98a3af)}
  .t-gold{background:linear-gradient(160deg,#fff0a8,#c99a1c)}
  .t-elite{background:linear-gradient(160deg,#d9b8ff,#5a2ea6);color:#fff}
  .t-elite::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    animation:shine 2.4s infinite}
  @keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .empty-card{width:56px;height:76px;border-radius:9px;border:2px dashed #ffffffaa;display:grid;place-items:center;
    color:#fff;font-size:11px;font-weight:700;background:#00000033;text-align:center}

  /* Pitch */
  .pitch{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:2px solid #ffffff40;
    background:repeating-linear-gradient(180deg,#2f8a45 0 10%,#2a7d3e 10% 20%)}
  .pitch::before{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:2px solid #ffffff55}
  .pitch::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid #ffffff55;border-radius:50%;transform:translate(-50%,-50%)}
  .pitch .box18{position:absolute;left:25%;right:25%;height:14%;border:2px solid #ffffff55}
  .slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1}
  .slot .card,.slot .empty-card{cursor:pointer}
  .dots{display:flex;gap:2px}
  .dots i{width:7px;height:7px;border-radius:50%;background:#00000066}
  .dots i.on{background:var(--grn)}
  .dots.bad i.on{background:var(--red)}
  .oop{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;font-size:10px;border-radius:6px;padding:1px 4px;z-index:2}

  /* Lists */
  .plist{display:flex;flex-direction:column;gap:8px}
  .pitem{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px}
  .pitem .info{flex:1;min-width:0}
  .pitem .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pitem .acts{display:flex;flex-direction:column;gap:5px}
  .tag{display:inline-block;background:#1e3a2a;color:var(--grn);font-size:11px;padding:2px 7px;border-radius:6px;margin-top:3px}

  /* Store */
  .packs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pack{border-radius:16px;padding:16px 12px;text-align:center;border:0;color:#1d1600;display:flex;flex-direction:column;gap:6px;align-items:center;min-height:170px;justify-content:center}
  .pack .pi{font-size:40px}
  .pack b{font-size:17px}
  .pack small{font-size:12px;opacity:.85}
  .pack .price{background:#00000030;border-radius:999px;padding:4px 12px;font-weight:800;margin-top:4px}
  .pack:disabled{filter:grayscale(.8);opacity:.6}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th{color:var(--mut);font-weight:600;padding:6px 3px;text-align:center}
  td{padding:8px 3px;text-align:center;border-top:1px solid var(--line)}
  td.tn{text-align:right;font-weight:600}
  tr.me td{background:#2a2410;color:var(--acc)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle}

  /* Overlays */
  .ov{position:fixed;inset:0;z-index:20;background:rgba(5,9,18,.88);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
  .packopen{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:16px 0}
  .flip{perspective:600px;width:78px;height:106px}
  .flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
  .flip.open .in{transform:rotateY(180deg)}
  .flip .front,.flip .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .flip .back{background:linear-gradient(150deg,#26324f,#121a2c);border:2px solid var(--acc);border-radius:11px;display:grid;place-items:center;font-size:30px}
  .flip .front{transform:rotateY(180deg)}
  .flip.best.open .card{box-shadow:0 0 22px var(--acc)}

  /* Match */
  #match{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;
    padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .score{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);border-radius:16px;padding:14px 10px}
  .score .tm{flex:1;text-align:center;font-weight:700;font-size:14px}
  .score .g{font-size:38px;font-weight:900;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
  .clock{text-align:center;color:var(--acc);font-weight:800;margin:10px 0 6px;font-variant-numeric:tabular-nums}
  .mini{position:relative;height:90px;border-radius:12px;margin-bottom:10px;overflow:hidden;
    background:repeating-linear-gradient(90deg,#2f8a45 0 10%,#2a7d3e 10% 20%);border:2px solid #ffffff40}
  .mini::before{content:"";position:absolute;top:8%;bottom:8%;left:50%;border-left:2px solid #ffffff55}
  .mini .ball{position:absolute;top:50%;font-size:18px;transform:translate(-50%,-50%);transition:left .5s,top .5s}
  .mom{display:flex;height:6px;border-radius:6px;overflow:hidden;margin-bottom:10px}
  .feed{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .ev{background:var(--panel);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;gap:8px;animation:pop .25s}
  .ev .m{color:var(--mut);min-width:30px;font-variant-numeric:tabular-nums}
  .ev.goal{background:#1e3a2a;font-weight:700}
  .ev.ogoal{background:#3a1e22;font-weight:700}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
  .mctl{display:flex;gap:8px;margin-top:10px}
  .mctl .btn{flex:1}

  /* Shot mini-game */
  .sg h3{text-align:center;line-height:1.4}
  .goalw{position:relative;height:170px;margin:14px 0 8px;direction:ltr}
  .goalf{position:absolute;left:4%;right:4%;top:0;height:110px;border:6px solid #fff;border-bottom:0;border-radius:4px 4px 0 0;
    background:repeating-linear-gradient(45deg,#ffffff14 0 6px,transparent 6px 12px),#1f6e37}
  .zone{position:absolute;top:0;height:110px;width:30.6%;background:transparent;border:2px dashed transparent;border-radius:8px;color:#fff;font-size:26px}
  .zone:hover,.zone:active{border-color:#ffffffaa;background:#ffffff18}
  .kp,.sball{pointer-events:none}
  .kp{position:absolute;top:58px;font-size:40px;transform:translate(-50%,-50%);transition:left .45s ease-out,top .45s;left:50%}
  .sball{position:absolute;top:150px;left:50%;font-size:26px;transform:translate(-50%,-50%);transition:left .5s ease-out,top .5s ease-out}
  .tbar{height:6px;background:#0e1628;border-radius:6px;overflow:hidden}
  .tbar i{display:block;height:100%;background:var(--acc);width:100%}
  .res{text-align:center;font-size:24px;font-weight:900;min-height:34px;margin-top:8px}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--txt);
    padding:10px 16px;border-radius:12px;z-index:30;font-weight:700;animation:pop .2s;max-width:90%;text-align:center}
</style>
</head>
<body>

  <div class="logo">⚽ Golden <span>XI</span></div>

  <button data-t="store"><span class="i">🎁</span>חבילות</button>
  <button data-t="club"><span class="i">👥</span>שחקנים</button>
  <button data-t="league"><span class="i">🏆</span>ליגה</button>
</nav>

function genPlayer(min, max, pos){
  if(!pos){ const r = R(); pos = r < .12 ? 'GK' : r < .42 ? 'DEF' : r < .72 ? 'MID' : 'FWD'; }
  const o = min + Math.floor(Math.pow(R(), 1.6) * (max - min + 1));
  return {id: S.nextId++, n: pick(FIRST) + ' ' + pick(LAST), pos, o, nat: pick(ACA_NATS), cl: 'ACA'};
}
/* Draw a real player from the database within a rating range. */
function realPlayer(min, max){
  let pool = DB.map((d, k) => k).filter(k => DB[k][2] >= min && DB[k][2] <= max);
  if(!pool.length) return genPlayer(60, 70);
  // Lower-rated players are more common.
  pool.sort((a, b) => DB[a][2] - DB[b][2]);
  const k = pool[Math.floor(Math.pow(R(), 1.5) * pool.length)];
  const [n, pos, o, nat, cl, sh] = DB[k];
  return {id: S.nextId++, k, n, sh, pos, o, nat, cl};
}
function makeSchedule(){
  const n = 8, ids = [...Array(n).keys()], rounds = [];
  for(let r = 0; r < n-1; r++){
    const pairs = [];
    for(let i = 0; i < n/2; i++){
      const a = ids[i], b = ids[n-1-i];
      pairs.push((r + i) % 2 ? [a, b] : [b, a]);
    }
    rounds.push(pairs);
    ids.splice(1, 0, ids.pop());
  }
  return rounds.concat(rounds.map(rd => rd.map(([h, a]) => [a, h])));
}

/* ---------- Squad logic ---------- */
const byId = id => S.players.find(p => p.id === id);
const lineupPlayers = () => S.lineup.map(id => id == null ? null : byId(id) || null);
const tier = o => o >= 87 ? 'elite' : o >= 80 ? 'gold' : o >= 72 ? 'silver' : 'bronze';
/* Two copies of the same real player can't both start. */
const ukey = p => p.k != null ? 'k' + p.k : 'a' + p.id;
function chemFor(i, lp){
  const p = lp[i]; if(!p) return 0;
  if(FORM[S.formation][i][0] !== p.pos) return 0;
  let nat = 0, cl = 0;
  lp.forEach((q, j) => { if(q && j !== i){ if(q.nat === p.nat) nat++; if(q.cl === p.cl) cl++; } });
  return Math.min(3, 1 + (nat >= 1 ? 1 : 0) + (cl >= 2 ? 1 : 0));
}
function effOf(i, lp){
  const p = lp[i], s = FORM[S.formation][i][0];
  if(s === p.pos) return p.o;
  return p.o - (s === 'GK' || p.pos === 'GK' ? 28 : 10);
}
function teamStats(){
  const lp = lineupPlayers(), sl = FORM[S.formation];
  const g = {GK:[],DEF:[],MID:[],FWD:[]};
  let chem = 0, sum = 0, cnt = 0;
  lp.forEach((p, i) => { if(!p) return; chem += chemFor(i, lp); g[sl[i][0]].push(effOf(i, lp)); sum += p.o; cnt++; });
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 25;
  const b = chem / 33 * 4;
  return {full: cnt === 11, chem, ovr: cnt ? Math.round(sum / cnt) : 0,
    att: avg(g.FWD) * .6 + avg(g.MID) * .4 + b,
    def: avg(g.GK) * .3 + avg(g.DEF) * .5 + avg(g.MID) * .2 + b};
}
function autoBest(silent){
  const sl = FORM[S.formation], used = new Set(), nl = Array(11).fill(null);
  const sorted = [...S.players].sort((a, b) => b.o - a.o);
  const order = [...sl.keys()].sort((a, b) => (sl[a][0] === 'GK' ? -1 : 0) - (sl[b][0] === 'GK' ? -1 : 0));
  order.forEach(i => { const p = sorted.find(q => !used.has(ukey(q)) && q.pos === sl[i][0]); if(p){ nl[i] = p.id; used.add(ukey(p)); } });
  order.forEach(i => { if(nl[i] == null){ const p = sorted.find(q => !used.has(ukey(q)) && q.pos !== 'GK'); if(p){ nl[i] = p.id; used.add(ukey(p)); } } });
  S.lineup = nl;
  if(!silent){ save(); render(); toast('ההרכב הטוב ביותר נבחר'); }
}
function setFormation(f){
  const pool = lineupPlayers().filter(Boolean), sl = FORM[f], nl = Array(11).fill(null);
  sl.forEach((s, i) => { const k = pool.findIndex(p => p.pos === s[0]); if(k >= 0){ nl[i] = pool[k].id; pool.splice(k, 1); } });
  sl.forEach((s, i) => { if(nl[i] == null && pool.length) nl[i] = pool.shift().id; });
  S.formation = f; S.lineup = nl; save(); render();
}

/* ---------- Match engine ---------- */
let M = null;
function aiStr(i){ const t = S.teams[i-1]; return {att: t.r + rint(-2, 2), def: t.r + rint(-2, 2)}; }

function randomName(){ return pick(FIRST) + ' ' + pick(LAST); }
function pickScorer(){
  const lp = lineupPlayers(), sl = FORM[S.formation], w = {FWD:6, MID:2.5, DEF:.6, GK:0};
  const pool = []; lp.forEach((p, i) => { if(p) for(let k = 0; k < w[sl[i][0]] * 2; k++) pool.push(p); });

}
function startMatch(){

    myConv: clamp(.32 * Math.pow(my.att / o.def, 2), .12, .6), opConv: clamp(.32 * Math.pow(o.att / my.def, 2), .12, .6),
    gk: gk ? gk.o : 50, scorers: [], speed: 1, paused: false, timer: null, ball: 50, momentum: 50};
  const hN = esc(teamName(fx.home ? 0 : fx.opp)), aN = esc(teamName(fx.home ? fx.opp : 0));

    <div class="mom" style="direction:ltr"><i id="mm1" style="background:var(--acc);width:50%"></i><i style="background:${S.teams[fx.opp-1].c};flex:1"></i></div>
    <div class="feed" id="feed"></div>
    <div class="mctl"><button class="btn sec" id="spd">⏩ מהירות x1</button></div>`;
  document.body.appendChild(el);
  $('#nav').style.display = 'none';

function loop(){ M.timer = setTimeout(() => { if(!M.paused) tick(); if(M) loop(); }, 260 / M.speed); }
function addEv(min, html, cls){

// The mini pitch is LTR: my team attacks to the right.
function moveBall(toward){
  M.ball = clamp(toward === 'me' ? M.ball + rint(5, 25) : toward === 'op' ? M.ball - rint(5, 25) : M.ball + rint(-12, 12), 6, 94);
  $('#mb').style.left = M.ball + '%'; $('#mb').style.top = rint(25, 75) + '%';

}
function tick(){
  M.min++;

  const oppN = S.teams[M.opp - 1].n;
  if(M.min === 45){ addEv(45, `⏸️ מחצית · ${M.my}–${M.op}`); }
  if(M.min >= M.end){ return endMatch(); }
  const r = R();
  if(r < M.myRate){
    moveBall('me'); const p = pickScorer();
    if(R() < .38) return shotGame('att', p);
    if(R() < M.myConv) goal(true, p.n);
    else addEv(M.min, pick([`${esc(p.n)} בועט... מעל המשקוף`, `השוער של ${oppN} מציל את הבעיטה של ${esc(p.n)}!`, `${esc(p.n)} פוגע בקורה! 😱`, `בעיטה של ${esc(p.n)} עוברת ליד הקורה`]));
  } else if(r < M.myRate + M.opRate){

function goal(mine, name){

function shotGame(kind, p){
  M.paused = true;

  const o = overlay(`<div class="sg"><h3>${M.min}' · ${title}</h3>
    <div class="goalw"><div class="goalf"></div>
      ${[0, 1, 2].map(d => `<button class="zone" data-d="${d}" style="left:${4 + d * 30.67}%">${['⬅','⬆','➡'][d]}</button>`).join('')}

    setTimeout(() => {
      const res = o.querySelector('#res');

      else res.innerHTML = scored ? '<span style="color:var(--red)">ספגנו... 😞</span>' : missWide ? 'החטיא! 😅' : '<span style="color:var(--grn)">הצלה אדירה! 🧤</span>';

      o.remove();
      if(scored) goal(kind === 'att', p.n);
      else addEv(M.min, kind === 'att' ? `${esc(p.n)} מחמיץ הזדמנות גדולה` : `🧤 הצלה ענקית מול ${esc(p.n)}!`);
      M.paused = false;
    }, 1700);
  }
  o.querySelectorAll('.zone').forEach(z => z.onclick = () => choose(+z.dataset.d));
}
function record(h, a, hg, ag){
  const H = S.table[h], A = S.table[a];
  H.gf += hg; H.ga += ag; A.gf += ag; A.ga += hg;
  if(hg > ag){ H.w++; H.p += 3; A.l++; } else if(hg < ag){ A.w++; A.p += 3; H.l++; } else { H.d++; A.d++; H.p++; A.p++; }
}
function endMatch(){
  clearTimeout(M.timer);
  const m = M; M = null;
  addEv(m.min, `🏁 שריקת סיום · ${m.my}–${m.op}`);
  const res = m.my > m.op ? 'W' : m.my === m.op ? 'D' : 'L';
  const reward = ({W:550, D:250, L:100})[res] + m.my * 70;
  S.coins += reward; S.form.push(res); S.form = S.form.slice(-10);
  S.stats.matches++; S.stats.goals += m.my; if(res === 'W') S.stats.wins++;
  // Record every fixture of the round.
  S.schedule[S.round].forEach(([h, a]) => {
    if(h === 0 || a === 0){ record(h, a, h === 0 ? m.my : m.op, h === 0 ? m.op : m.my); return; }
    const sh = aiStr(h), sa = aiStr(a);
    record(h, a, poisson(clamp(1.35 * Math.pow((sh.att + 1.5) / sa.def, 3), .3, 3.5)), poisson(clamp(1.15 * Math.pow(sa.att / (sh.def + 1.5), 3), .3, 3.5)));
  });
  S.round++;
  save();
  setTimeout(() => {
    const o = overlay(`<div style="text-align:center">
      <div style="font-size:46px">${{W:'🎉', D:'🤝', L:'😔'}[res]}</div>
      <h2>${{W:'ניצחון!', D:'תיקו', L:'הפסד'}[res]}</h2>
      <div style="font-size:30px;font-weight:900;margin:6px 0">${m.my} – ${m.op}</div>
      <div class="mut">נגד ${S.teams[m.opp - 1].n}</div>
      ${m.scorers.length ? `<div style="margin:12px 0">⚽ ${m.scorers.map(esc).join(' · ')}</div>` : ''}
      <div class="coins" style="display:inline-block;margin:10px 0">+${reward} 🪙</div>
      <button class="btn big" id="cont">המשך</button></div>`);
    o.querySelector('#cont').onclick = () => {
      o.remove(); $('#match').remove(); $('#nav').style.display = '';
      if(S.round >= S.schedule.length) seasonEnd(); else { tab = 'home'; render(); }
    };
  }, 900);
}
function seasonEnd(){
  const place = position();
  const prize = [9000, 5500, 3500][place - 1] || 1500;
  S.coins += prize;
  if(place === 1) S.stats.titles++;
  const o = overlay(`<div style="text-align:center"><div style="font-size:54px">${place === 1 ? '🏆' : place <= 3 ? '🏅' : '📅'}</div>
    <h2>סוף עונה ${S.season}</h2><div style="font-size:20px;margin-bottom:8px">סיימתם במקום ${place}</div>
    ${place === 1 ? '<div style="color:var(--acc);font-weight:800;margin-bottom:8px">אלופים!</div>' : ''}
    <div class="coins" style="display:inline-block;margin:8px 0">+${prize.toLocaleString()} 🪙</div>
    <div class="mut" style="margin:8px 0 14px">העונה הבאה תהיה קשה יותר. היריבות התחזקו.</div>
    <button class="btn big" id="ns">התחל עונה ${S.season + 1}</button></div>`);
  o.querySelector('#ns').onclick = () => {
    S.season++; S.round = 0; S.table = newTable(); S.schedule = makeSchedule();
    S.teams.forEach(t => t.r = Math.min(92, t.r + rint(1, 3)));
    save(); o.remove(); tab = 'home'; render();
  };
}

/* ---------- Boot ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo(0, 0); });
S = load();
if(!S || !S.players){ newGame(); }
render();
</script>
