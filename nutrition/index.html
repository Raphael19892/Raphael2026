<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צלחת סיבים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one centered column; sticky top bar with tabs on desktop, fixed tab bar at the bottom on phones. */
:root {
  --bg: #F1F4EC; --surface: #FFFFFF; --surface-2: #E7ECDF; --line: #D3DBC8;
  --fg: #1C2419; --muted: #5B6755;
  --accent: #476628; --accent-ink: #FFFFFF; --accent-soft: #DCE7CB;
  --warn: #9A6412; --warn-soft: #F6E6C4; --ok: #2F7232; --ok-soft: #D5EBD1;
  --over: #24688A; --over-soft: #D3E7F1; --block: #A32D3A; --block-soft: #F7DADD;
  --c-fruit: #C23B4B; --c-veg: #4C8A37; --c-grain: #BF8F1F; --c-legume: #99562A; --c-nut: #74563F;
  --c-protein: #8A8D97; --c-other: #98A08C;
  --shadow: 0 1px 2px rgba(28,36,25,.06), 0 4px 16px rgba(28,36,25,.06);
  --font-display: "Secular One", "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --font-body: "Rubik", "Heebo", "Arial Hebrew", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121810; --surface: #1A2217; --surface-2: #232D1F; --line: #33402D;
  --fg: #E7EEDE; --muted: #A2AF95;
  --accent: #A3C872; --accent-ink: #13200C; --accent-soft: #2C3B20;
  --warn: #E6B451; --warn-soft: #3A2F16; --ok: #84C977; --ok-soft: #1E381B;
  --over: #78BBDD; --over-soft: #16303F; --block: #F2808A; --block-soft: #3E1A1F;
  --c-fruit: #E86B79; --c-veg: #82BF6B; --c-grain: #E2BA5A; --c-legume: #CF8955; --c-nut: #B48D70;
  --c-protein: #A7AAB4; --c-other: #868D7B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121810; --surface: #1A2217; --surface-2: #232D1F; --line: #33402D;
  --fg: #E7EEDE; --muted: #A2AF95;
  --accent: #A3C872; --accent-ink: #13200C; --accent-soft: #2C3B20;
  --warn: #E6B451; --warn-soft: #3A2F16; --ok: #84C977; --ok-soft: #1E381B;
  --over: #78BBDD; --over-soft: #16303F; --block: #F2808A; --block-soft: #3E1A1F;
  --c-fruit: #E86B79; --c-veg: #82BF6B; --c-grain: #E2BA5A; --c-legume: #CF8955; --c-nut: #B48D70;
  --c-protein: #A7AAB4; --c-other: #868D7B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  direction: rtl; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.2; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1000px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { font-size: 1.35rem; }
.brand small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.2; }
.tabs { display: flex; gap: 4px; margin-inline-start: auto; }
.tab {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 999px;
  color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px;
}
.tab svg { width: 18px; height: 18px; }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--fg); }
.tab:hover { color: var(--fg); }

main {
  max-width: 1000px; margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.view { display: grid; gap: 18px; }

@media (max-width: 760px) {
  .tabs {
    position: fixed; inset: auto 0 0 0; z-index: 25; margin: 0;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    justify-content: space-around;
  }
  .tab { flex-direction: column; gap: 2px; font-size: .74rem; padding: 6px 8px; border-radius: 10px; flex: 1; }
  .tab svg { width: 22px; height: 22px; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- generic pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-h h2 { font-size: 1.2rem; }
.eyebrow { font-size: .74rem; letter-spacing: .04em; color: var(--muted); font-weight: 500; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 8px 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); border-color: var(--line); }
.btn.danger { color: var(--block); border-color: var(--block); background: transparent; }
.btn.sm { padding: 5px 10px; font-size: .86rem; border-radius: 8px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; padding: 0; flex: none; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: .88rem; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
.pill.under { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.over { background: var(--over-soft); color: var(--over); }
input[type="search"], input[type="text"], input[type="number"], select, textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
label.field { display: grid; gap: 4px; font-size: .86rem; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- today ---------- */
.datebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.datebar h2 { font-size: 1.45rem; margin-inline-end: auto; }
.summary { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.ring { width: 170px; height: 170px; display: block; }
.ring text { fill: var(--fg); font-family: var(--font-body); }
.stats { display: grid; gap: 14px; min-width: 0; }
.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
.stat span { font-size: .8rem; color: var(--muted); }
.stackbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.stackbar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.water { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.glass { width: 24px; height: 30px; border: 0; background: none; padding: 0; color: var(--line); }
.glass.on { color: var(--over); }
.glass svg { width: 100%; height: 100%; }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; max-height: 360px; overflow-y: auto; }
.res { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 10px; }
.res:hover { background: var(--surface-2); }
.res .nm { flex: 1; min-width: 0; }
.res .nm small { display: block; color: var(--muted); font-size: .8rem; }
.res .fb { font-size: .86rem; color: var(--muted); white-space: nowrap; }
.alert { border-radius: 10px; padding: 10px 12px; font-size: .9rem; display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; }
.alert.block { background: var(--block-soft); color: var(--block); }
.alert svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.meal-block + .meal-block { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
.meal-block h3 { font-family: var(--font-body); font-weight: 600; font-size: .95rem; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.entry { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.entry .nm { flex: 1; min-width: 0; }
.entry .nm small { color: var(--muted); font-size: .8rem; }
.qty { display: inline-flex; align-items: center; gap: 4px; }
.qty .icon-btn { width: 26px; height: 26px; }
.qty b { min-width: 2.2em; text-align: center; font-weight: 500; font-size: .9rem; }
.entry .fb { min-width: 3.6em; text-align: start; font-weight: 600; font-size: .9rem; }
.empty { text-align: center; padding: 22px 10px; color: var(--muted); }
.empty svg { width: 46px; height: 46px; color: var(--accent); opacity: .7; }
.custom-form { display: grid; grid-template-columns: 2fr 1.4fr 1fr 1.4fr; gap: 8px; margin-top: 10px; align-items: end; }
.custom-form .btn { height: 41px; }

/* ---------- meals ---------- */
.gen-controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
.gen-controls .btn.primary { margin-inline-start: auto; }
.meal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.meal-card { display: flex; flex-direction: column; gap: 12px; }
.meal-card header { display: grid; gap: 6px; }
.meal-card h3 { font-size: 1.15rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: .8rem; }
.meta span { background: var(--surface-2); border-radius: 999px; padding: 2px 9px; }
.meta .fiber-tag { background: var(--accent-soft); font-weight: 600; }
.meta .new-tag { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.ing { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: .9rem; }
.ing li { display: flex; align-items: center; gap: 8px; }
.ing li .nm { flex: 1; min-width: 0; }
.ing li .fb { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.ing .new { font-size: .7rem; color: var(--ok); font-weight: 600; }
.steps { margin: 0; padding-inline-start: 20px; font-size: .88rem; color: var(--muted); display: grid; gap: 3px; }
.meal-card footer { display: flex; gap: 8px; margin-top: auto; }
.meal-card footer .btn.primary { flex: 1; }
.note { font-size: .85rem; color: var(--muted); }

/* ---------- week ---------- */
.week-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 18px; align-items: stretch; }
.big-count { display: flex; align-items: baseline; gap: 8px; }
.big-count b { font-family: var(--font-display); font-weight: 400; font-size: 3.2rem; line-height: 1; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 12px 0; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.cat-counts { display: grid; gap: 6px; font-size: .88rem; }
.cat-counts div { display: flex; align-items: center; gap: 8px; }
.cat-counts div span:nth-child(2) { flex: 1; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-body); fill: var(--muted); font-size: 11px; }
.chart .val { fill: var(--fg); font-weight: 600; }
.plant-cat + .plant-cat { margin-top: 16px; }
.plant-cat h3 { font-family: var(--font-body); font-size: .95rem; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pchip { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: .86rem; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.pchip svg { width: 13px; height: 13px; }
.pchip.log { border-style: solid; border-color: transparent; background: var(--ok-soft); color: var(--ok); font-weight: 500; cursor: default; }
.pchip.manual { border-style: solid; border-color: var(--ok); color: var(--ok); background: transparent; font-weight: 500; }
.key { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-bottom: 12px; }

/* ---------- pantry & settings ---------- */
.pantry-cat + .pantry-cat { margin-top: 16px; }
.pantry-cat .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.pantry-cat .hd h3 { font-family: var(--font-body); font-size: .95rem; font-weight: 600; margin-inline-end: auto; display: flex; align-items: center; gap: 8px; }
.settings-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.blocked-list { display: grid; gap: 10px; }
.blocked-group { background: var(--block-soft); border-radius: 10px; padding: 10px 12px; }
.blocked-group b { color: var(--block); font-size: .9rem; }
.blocked-group p { margin: 2px 0 0; font-size: .82rem; color: var(--fg); opacity: .85; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { background: var(--block-soft); color: var(--block); border-radius: 999px; padding: 3px 6px 3px 10px; font-size: .85rem; display: inline-flex; align-items: center; gap: 4px; }
.tag button { border: 0; background: none; color: inherit; padding: 0 4px; font-size: 1rem; line-height: 1; }
.inline-form { display: flex; gap: 8px; margin-top: 8px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--block-soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: .9rem; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem;
  transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast { display: flex; align-items: center; gap: 12px; }
.toast button { border: 0; background: transparent; color: var(--accent-soft); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 2px 4px; }
.res .qty b { color: var(--accent); font-weight: 700; }
@media (max-width: 760px) { .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }

@media (max-width: 860px) {
  .grid-2, .week-top { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .summary { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 14px; }
  .stats { width: 100%; }
  .ring { width: 150px; height: 150px; }
  .stat b { font-size: 1.15rem; }
  .custom-form { grid-template-columns: 1fr 1fr; }
  .custom-form .wide { grid-column: 1 / -1; }
  .settings-grid { grid-template-columns: minmax(0, 1fr); }
  .brand small { display: none; }
  .card { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" dir="rtl">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="var(--accent-soft)"/>
          <path d="M20 31c0-9 3-15 10-19-2 9-5 14-10 19z" fill="var(--accent)"/>
          <path d="M20 31c0-7-3-12-9-15 1 7 4 12 9 15z" fill="var(--c-veg)"/>
          <circle cx="14" cy="11" r="3" fill="var(--c-fruit)"/>
        </svg>
        <div>
          <h1>צלחת סיבים</h1>
          <small>ים-תיכוני + DASH · ללא דגים ופירות ים</small>
        </div>
      </div>
      <nav class="tabs" aria-label="ניווט ראשי">
        <button class="tab" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>היום</button>
        <button class="tab" data-view="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 8c0-2 2-2 2-4M14 8c0-2 2-2 2-4"/></svg>ארוחות</button>
        <button class="tab" data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>שבוע</button>
        <button class="tab" data-view="pantry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 4h14v16H5zM5 10h14M5 15h14"/></svg>מזווה</button>
      </nav>
    </div>
  </header>
  <main id="main"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
'use strict';
document.documentElement.lang = 'he';
document.documentElement.dir = 'rtl';

/* =========================================================
   Reference data
   ========================================================= */
const MEALS = [['breakfast', 'בוקר'], ['lunch', 'צהריים'], ['dinner', 'ערב'], ['snack', 'נשנושים']];
const MEAL_NAME = Object.fromEntries(MEALS);

const CATS = {
  fruit:   { name: 'פירות',             plant: true,  color: 'var(--c-fruit)' },
  veg:     { name: 'ירקות',             plant: true,  color: 'var(--c-veg)' },
  grain:   { name: 'דגנים מלאים',       plant: true,  color: 'var(--c-grain)' },
  legume:  { name: 'קטניות',            plant: true,  color: 'var(--c-legume)' },
  nut:     { name: 'אגוזים וזרעים',     plant: true,  color: 'var(--c-nut)' },
  protein: { name: 'ביצים, חלב וחלבון', plant: false, color: 'var(--c-protein)' },
  other:   { name: 'שונות',             plant: false, color: 'var(--c-other)' },
};
const CAT_ORDER = ['fruit', 'veg', 'grain', 'legume', 'nut', 'protein', 'other'];
const PLANT_CATS = CAT_ORDER.filter(c => CATS[c].plant);

// [id, name, category, fiber grams per portion, portion, search aliases]
// Fiber values are approximate (USDA / Israeli nutrition tables, rounded).

const HE_PREFIX = 'והבלמשכ';

function norm(s) {
  return String(s || '').toLowerCase()
    .replace(/[֑-ׇ]/g, '')
    .replace(/['`’]/g, '׳').replace(/["”“]/g, '״')
    .replace(/\s+/g, ' ').trim();
}
function checkBlocked(text) {
  const t = norm(text);
  if (!t) return null;
  const tokens = t.split(/[\s,.\-\/()+&]+/).filter(Boolean);
  for (const g of BLOCK_GROUPS) {
    for (const p of g.phrases) if (t.includes(p)) return { label: g.label, word: p };
    for (const tok of tokens) {
      const variants = [tok];
      if (HE_PREFIX.includes(tok[0]) && tok.length > 2) variants.push(tok.slice(1));
      if (HE_PREFIX.includes(tok[0]) && HE_PREFIX.includes(tok[1]) && tok.length > 3) variants.push(tok.slice(2));
      for (const v of variants) {
        if (g.exact.includes(v)) return { label: g.label, word: tok };
        for (const st of g.stems) if (v.startsWith(st)) return { label: g.label, word: tok };
      }
    }
  }
  for (const w of S.settings.extraBlocked) {
    const nw = norm(w);
    if (nw && t.includes(nw)) return { label: 'חסום אישית', word: w };
  }
  return null;
}

const KEY = 'tzalachat-sivim.v1';
const DEFAULTS = () => ({
  v: 1,

  log: {}, water: {}, manual: {}, pantry: null, custom: [],
});
let storageOK = true;
function load() {
  const d = DEFAULTS();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return d;
    const p = JSON.parse(raw);
    return Object.assign(d, p, { settings: Object.assign(d.settings, p.settings || {}) });
  } catch (e) { storageOK = false; return d; }
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
}

/* ---------- dates (week starts Sunday) ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const weekStart = k => { const d = fromKey(k); d.setDate(d.getDate() - d.getDay()); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const DAY_LETTER = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const fmtDay = k => fromKey(k).toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = k => fromKey(k).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' });

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const g1 = n => { const r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const uid = () => Math.random().toString(36).slice(2, 10);
const allFoods = () => BASE_FOODS.concat(S.custom);
const foodById = id => allFoods().find(f => f.id === id);
const isPlant = cat => !!(CATS[cat] && CATS[cat].plant);
const foodBlocked = f => checkBlocked(f.name + ' ' + (f.alias || ''));
const dayEntries = k => S.log[k] || [];
const dayFiber = k => dayEntries(k).reduce((a, e) => a + e.fiber * e.qty, 0);
function joinHe(names) {
  if (names.length <= 1) return names[0] || '';
  return names.slice(0, -1).join(', ') + ' ו' + names[names.length - 1];
}
function defaultMeal() {
  const h = new Date().getHours();
  if (h < 11) return 'breakfast';
  if (h < 16) return 'lunch';
  if (h < 20) return 'dinner';
  return 'snack';
}
// plants eaten in a week: id -> { name, cat, src: 'log' | 'manual' }
function weekPlants(ws) {
  const m = new Map();
  for (let i = 0; i < 7; i++) {
    for (const e of dayEntries(addDays(ws, i))) {
      if (isPlant(e.cat) && !m.has(e.foodId)) m.set(e.foodId, { name: e.name, cat: e.cat, src: 'log' });
    }
  }
  for (const id of (S.manual[ws] || [])) {
    if (m.has(id)) continue;
    const f = foodById(id);
    if (f && isPlant(f.cat)) m.set(id, { name: f.name, cat: f.cat, src: 'manual' });
  }
  return m;
}
function fiberStatus(g) {
  const { fiberMin: lo, fiberMax: hi } = S.settings;
  if (g < lo) return { cls: 'under', label: 'בדרך ליעד', hint: `עוד ${g1(lo - g)} ג׳ להגיע ל-${lo}` };
  if (g <= hi) return { cls: 'ok', label: 'בטווח היעד', hint: `בין ${lo} ל-${hi} גרם. כל הכבוד!` };
  return { cls: 'over', label: 'מעל הטווח', hint: 'הרבה סיבים: הקפידו על שתייה מרובה' };
}
let toastTimer;
let undoFn = null;
function toast(msg, onUndo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${onUndo ? '<button type="button" id="toast-undo">ביטול</button>' : ''}`;
  undoFn = onUndo || null;
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.classList.remove('show'); undoFn = null; }, onUndo ? 5000 : 2200);
}
// snapshot of one day's log, returned as an undo function
function snapshotDay(k) {
  const before = JSON.stringify(S.log[k] || []);
  return () => {
    const arr = JSON.parse(before);
    if (arr.length) S.log[k] = arr; else delete S.log[k];
    save(); render(); toast('הפעולה בוטלה');
  };
}

function ringSvg(total) {
  const { fiberMin: lo, fiberMax: hi } = S.settings;
  const scale = Math.max(hi * 1.15, total);
  const r1 = 58, r2 = 67, C1 = 2 * Math.PI * r1, C2 = 2 * Math.PI * r2;
  const prog = Math.min(total / scale, 1) * C1;
  const bandStart = lo / scale * C2, bandLen = (hi - lo) / scale * C2;
  const st = fiberStatus(total);
  const col = st.cls === 'under' ? 'var(--warn)' : st.cls === 'ok' ? 'var(--ok)' : 'var(--over)';
  return `<svg class="ring" viewBox="0 0 150 150" role="img" aria-label="${g1(total)} גרם סיבים מתוך יעד ${lo} עד ${hi}">
    <g transform="rotate(-90 75 75)">
      <circle cx="75" cy="75" r="${r1}" fill="none" stroke="var(--surface-2)" stroke-width="13"/>
      <circle cx="75" cy="75" r="${r1}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
        stroke-dasharray="${prog} ${C1}" style="transition: stroke-dasharray .5s"/>
      <circle cx="75" cy="75" r="${r2}" fill="none" stroke="var(--ok)" stroke-opacity=".55" stroke-width="3"
        stroke-dasharray="${bandLen} ${C2}" stroke-dashoffset="${-bandStart}"/>
    </g>
    <text x="75" y="72" text-anchor="middle" font-size="34" font-weight="700" class="num">${g1(total)}</text>
    <text x="75" y="92" text-anchor="middle" font-size="12" style="fill: var(--muted)">גרם סיבים</text>
    <text x="75" y="108" text-anchor="middle" font-size="11" style="fill: var(--muted)">יעד ${lo}–${hi}</text>
  </svg>`;
}

function frequentFoods() {
  const count = {};
  for (const k in S.log) for (const e of S.log[k]) count[e.foodId] = (count[e.foodId] || 0) + 1;
  const ids = Object.keys(count).sort((a, b) => count[b] - count[a]).filter(id => foodById(id));
  const defaults = ['oats', 'chia', 'apple', 'lentils', 'chickpeas', 'walnut', 'rye_bread', 'avocado', 'greek_yogurt', 'egg'];
  for (const d of defaults) if (!ids.includes(d)) ids.push(d);
  return ids.slice(0, 10).map(foodById).filter(f => f && !foodBlocked(f));
}

function renderResults() {
  const wrap = $('#results-wrap');
  if (!wrap) return;
  const q = norm(UI.query);
  const blocked = q ? checkBlocked(UI.query) : null;
  let html = '';
  if (blocked) {
    html += `<div class="alert block" role="alert">${ICON.ban}<div><b>"${esc(UI.query.trim())}" חסום</b><br>הקטגוריה "${esc(blocked.label)}" אינה חלק מהתפריט שלך, ולכן לא ניתן להוסיף אותו.</div></div>`;
  }
  let foods;
  if (!q) foods = frequentFoods();
  else {
    foods = allFoods().filter(f => !foodBlocked(f) && (norm(f.name).includes(q) || norm(f.alias).includes(q) || norm(CATS[f.cat].name).includes(q)));
    foods.sort((a, b) => (norm(b.name).startsWith(q) - norm(a.name).startsWith(q)) || b.fiber - a.fiber);
  }
  if (!q) html += '<div class="eyebrow" style="margin-top:12px">גישה מהירה</div>';
  if (foods.length) {
    html += `<ul class="results">${foods.slice(0, 40).map(f => `<li class="res">
      <i class="dot" style="background:${CATS[f.cat].color}"></i>
      <div class="nm">${esc(f.name)}<small>${esc(f.portion)} · ${CATS[f.cat].name}</small></div>

    html += `<p class="note" style="margin-top:10px">לא נמצא "${esc(UI.query.trim())}". אפשר להוסיף אותו כמזון חדש בכפתור למטה.</p>`;

}

function resQty(f) {

  const plus = `<button class="icon-btn" data-act="add" data-id="${esc(f.id)}" aria-label="הוספת ${esc(f.name)} ל${MEAL_NAME[UI.addMeal]}">${ICON.plus}</button>`;

  return `<div class="qty">

    <b class="num">×${g1(e.qty)}</b>${plus}</div>`;

function addEntry(dateKey, food, qty, meal) {
  const same = (S.log[dateKey] || []).find(x => x.foodId === food.id && x.meal === meal);
  if (same) { same.qty = Math.min(10, same.qty + qty); return; }
  (S.log[dateKey] = S.log[dateKey] || []).push({
    id: uid(), foodId: food.id, name: food.name, cat: food.cat, fiber: food.fiber,
    portion: food.portion, qty, meal,
  });
}

   ========================================================= */
function pantrySet() {
  const ids = S.pantry ? S.pantry : allFoods().map(f => f.id);
  return new Set(ids.filter(id => { const f = foodById(id); return f && !foodBlocked(f); }));
}
function weightedPick(pool, n, weekSet) {
  const p = pool.slice(), out = [];
  while (out.length < n && p.length) {
    const w = p.map(id => (S.settings.preferNew && isPlant(foodById(id).cat) && !weekSet.has(id)) ? 4 : 1);
    let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
    while (r > w[i]) { r -= w[i]; i++; }
    out.push(p.splice(Math.min(i, p.length - 1), 1)[0]);
  }
  return out;
}
function buildMeal(t, avail, weekSet) {
  const used = new Set(), picks = {}, items = [], missing = [];
  for (const s of t.slots) {
    const pool = s.from.filter(id => avail.has(id) && !used.has(id));
    if (!pool.length) { if (!s.opt) missing.push(s); continue; }
    if (s.opt && Math.random() < 0.3) continue;
    const chosen = weightedPick(pool, s.n || 1, weekSet);
    chosen.forEach(id => used.add(id));
    picks[s.k] = chosen;
    chosen.forEach(id => items.push({ foodId: id, qty: s.qty || 1 }));
  }
  if (missing.length) return { tid: t.id, missing: missing.map(s => s.from.map(id => foodById(id)).filter(Boolean).slice(0, 3).map(f => f.name).join(' / ')) };
  const name = id => foodById(id).name;
  const steps = t.steps.filter(st => !st.need || picks[st.need]).map(st => st.t.replace(/\{(\w+)\}/g, (_, k) => joinHe((picks[k] || []).map(name))));
  const fiber = items.reduce((a, it) => a + foodById(it.foodId).fiber * it.qty, 0);
  const plants = items.filter(it => isPlant(foodById(it.foodId).cat));
  const fresh = plants.filter(it => !weekSet.has(it.foodId)).length;
  return { tid: t.id, items, steps, fiber, plants: plants.length, fresh };
}
function generate() {
  const avail = pantrySet(), weekSet = new Set(weekPlants(weekStart(UI.date)).keys());
  const ts = TEMPLATES.filter(t => UI.genMeal === 'all' || t.meals.includes(UI.genMeal));
  const ok = [], blocked = [];
  for (const t of ts) {
    // a few attempts per template, keep the one with most fiber
    let best = null;
    for (let i = 0; i < 3; i++) {
      const m = buildMeal(t, avail, weekSet);
      if (m.missing) { best = m; break; }
      if (!best || m.fiber + m.fresh * 1.5 > best.fiber + best.fresh * 1.5) best = m;
    }
    (best.missing ? blocked : ok).push(best);
  }
  ok.sort(() => Math.random() - 0.5);
  UI.suggestions = { list: ok.slice(0, UI.genMeal === 'all' ? 6 : 4), missing: blocked };
}
function rerollOne(idx) {
  const cur = UI.suggestions.list[idx];
  const t = TEMPLATES.find(x => x.id === cur.tid);
  const m = buildMeal(t, pantrySet(), new Set(weekPlants(weekStart(UI.date)).keys()));
  if (!m.missing) UI.suggestions.list[idx] = m;
}

/* =========================================================
   View: Week
   ========================================================= */
function weekChart(ws) {
  const { fiberMin: lo, fiberMax: hi } = S.settings;
  const vals = Array.from({ length: 7 }, (_, i) => dayFiber(addDays(ws, i)));
  const W = 560, H = 210, top = 22, bottom = 34, left = 12, right = 34;
  const ymax = Math.max(hi + 10, Math.ceil(Math.max(...vals) / 10) * 10);
  const y = v => top + (H - top - bottom) * (1 - v / ymax);
  const slot = (W - left - right) / 7;
  const bw = Math.min(40, slot * 0.6);
  const tk = todayKey();
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרם סיבים לפי יום בשבוע">
    <rect x="${left}" y="${y(hi)}" width="${W - left - right}" height="${y(lo) - y(hi)}" fill="var(--ok-soft)"/>
    <line x1="${left}" x2="${W - right}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--ok)" stroke-dasharray="4 4"/>
    <line x1="${left}" x2="${W - right}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--ok)" stroke-dasharray="4 4" stroke-opacity=".5"/>
    <line x1="${left}" x2="${W - right}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <text x="${W - right + 6}" y="${y(lo) + 4}">${lo}</text>
    <text x="${W - right + 6}" y="${y(hi) + 4}">${hi}</text>`;
  vals.forEach((v, i) => {
    // RTL: Sunday on the right
    const cx = W - right - slot * (i + 0.5);
    const k = addDays(ws, i);
    const st = fiberStatus(v).cls;
    const col = v === 0 ? 'var(--surface-2)' : st === 'under' ? 'var(--warn)' : st === 'ok' ? 'var(--ok)' : 'var(--over)';
    const h = Math.max(y(0) - y(v), v > 0 ? 2 : 0);
    s += `<rect x="${cx - bw / 2}" y="${y(0) - h}" width="${bw}" height="${h}" rx="5" fill="${col}"/>`;
    if (v > 0) s += `<text class="val" x="${cx}" y="${y(v) - 6}" text-anchor="middle">${g1(v)}</text>`;
    s += `<text x="${cx}" y="${H - 14}" text-anchor="middle" ${k === tk ? 'class="val"' : ''}>${DAY_LETTER[i]}</text>`;
    s += `<text x="${cx}" y="${H - 1}" text-anchor="middle" font-size="9">${fmtShort(k)}</text>`;
  });
  return s + '</svg>';
}

        ${weekChart(ws)}

      <div class="card-h"><h2>רשימת מעקב: צמחים השבוע</h2></div>
      <div class="key">

      </div>
      ${PLANT_CATS.map(c => {

        return `<div class="plant-cat"><h3><i class="dot" style="background:${CATS[c].color}"></i>${CATS[c].name} <span class="muted num" style="font-weight:400">${catCount(c)}/${fs.length}</span></h3>
          <div class="chips">${fs.map(f => {
            const p = plants.get(f.id);

            return `<button class="pchip" data-act="manual" data-id="${esc(f.id)}" aria-pressed="false">${esc(f.name)}</button>`;

    </div>
  </section>`;
}

/* =========================================================
   Events
   ========================================================= */
function removeEntry(id) {
  S.log[UI.date] = dayEntries(UI.date).filter(x => x.id !== id);
  if (!S.log[UI.date].length) delete S.log[UI.date];
}

document.addEventListener('click', ev => {
  if (ev.target.id === 'toast-undo') {
    const fn = undoFn; undoFn = null;
    $('#toast').classList.remove('show');
    if (fn) fn();
    return;
  }
  const tab = ev.target.closest('.tab');
  if (tab) { go(tab.dataset.view); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'goto': ev.preventDefault(); go(el.dataset.v); break;
    case 'day': UI.date = addDays(UI.date, +el.dataset.d); render(); break;
    case 'day-today': UI.date = todayKey(); render(); break;
    case 'add-meal':
      UI.addMeal = el.dataset.m;
      document.querySelectorAll('[data-act="add-meal"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === UI.addMeal));
      renderResults(); break;
    case 'add': {
      const f = foodById(el.dataset.id);
      if (!f || foodBlocked(f)) return;
      const undo = snapshotDay(UI.date);
      addEntry(UI.date, f, 1, UI.addMeal); save(); refreshToday(); renderResults();
      toast(`נוסף ל${MEAL_NAME[UI.addMeal]}: ${f.name} (${g1(f.fiber)} ג׳)`, undo);
      break;
    }
    case 'sub': {
      const e = dayEntries(UI.date).find(x => x.foodId === el.dataset.id && x.meal === UI.addMeal);
      if (!e) return;
      const undo = snapshotDay(UI.date);
      e.qty = Math.round((e.qty - 1) * 10) / 10;
      if (e.qty <= 0) removeEntry(e.id);
      save(); refreshToday(); renderResults();
      toast(e.qty > 0 ? `${e.name}: ×${g1(e.qty)}` : `${e.name} הוסר מ${MEAL_NAME[UI.addMeal]}`, undo);
      break;
    }
    case 'qty': {
      const e = dayEntries(UI.date).find(x => x.id === el.dataset.id);
      if (!e) return;
      const d = +el.dataset.d;
      if (d < 0 && e.qty <= 0.5) {
        // minus on the last half portion removes the item
        const undo = snapshotDay(UI.date);
        removeEntry(e.id); save(); refreshToday(); renderResults();
        toast(`${e.name} הוסר`, undo); break;
      }
      e.qty = Math.max(0.5, Math.min(10, e.qty + d)); save(); refreshToday(); renderResults(); break;
    }
    case 'del': {
      const e = dayEntries(UI.date).find(x => x.id === el.dataset.id);
      const undo = snapshotDay(UI.date);
      removeEntry(el.dataset.id); save(); refreshToday(); renderResults();
      if (e) toast(`${e.name} הוסר`, undo);
      break;
    }
    case 'water': {
      const n = +el.dataset.n, cur = S.water[UI.date] || 0;
      S.water[UI.date] = cur === n ? n - 1 : n; save(); refreshToday(); break;
    }
    case 'toggle-custom': UI.showCustom = !UI.showCustom; render(); if (UI.showCustom) { const n = $('#cf-name'); n && n.focus(); } break;
    case 'gen-meal': UI.genMeal = el.dataset.m; generate(); render(); break;
    case 'generate': generate(); render(); break;
    case 'reroll': rerollOne(+el.dataset.i); render(); break;
    case 'log-meal': {
      const m = UI.suggestions.list[+el.dataset.i];
      const undo = snapshotDay(UI.date);
      m.items.forEach(it => addEntry(UI.date, foodById(it.foodId), it.qty, el.dataset.m));
      save();
      toast(`${TEMPLATES.find(t => t.id === m.tid).name} נוספה ליומן: +${g1(m.fiber)} ג׳`, undo);
      render(); break;
    }
    case 'week': UI.week = addDays(UI.week, +el.dataset.d); render(); break;
    case 'week-now': UI.week = weekStart(todayKey()); render(); break;
    case 'manual': {
      const id = el.dataset.id, ws = UI.week;
      const arr = S.manual[ws] = S.manual[ws] || [];
      const i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
      if (!arr.length) delete S.manual[ws];
      save(); render(); break;
    }
    case 'pantry': {
      const set = S.pantry ? new Set(S.pantry) : new Set(allFoods().map(f => f.id));
      const id = el.dataset.id;
      set.has(id) ? set.delete(id) : set.add(id);
      S.pantry = [...set]; UI.suggestions = null; save();
      el.setAttribute('aria-pressed', set.has(id)); break;
    }
    case 'pantry-all':
      S.pantry = el.dataset.v === '1' ? null : []; UI.suggestions = null; save(); render(); break;
    case 'pantry-cat': {
      const set = S.pantry ? new Set(S.pantry) : new Set(allFoods().map(f => f.id));
      allFoods().filter(f => f.cat === el.dataset.c).forEach(f => el.dataset.v === '1' ? set.add(f.id) : set.delete(f.id));
      S.pantry = [...set]; UI.suggestions = null; save(); render(); break;
    }
    case 'unblock': S.settings.extraBlocked.splice(+el.dataset.i, 1); UI.suggestions = null; save(); render(); break;
    case 'del-custom':
      S.custom = S.custom.filter(f => f.id !== el.dataset.id);
      if (S.pantry) S.pantry = S.pantry.filter(id => id !== el.dataset.id);
      save(); render(); break;
    case 'backup': {
      const txt = JSON.stringify(S);
      const box = $('#backup-text');
      const fallback = () => { box.hidden = false; box.value = txt; box.select(); toast('סמנו את הטקסט והעתיקו ידנית'); };
      try {
        navigator.clipboard.writeText(txt).then(() => toast('הגיבוי הועתק ללוח'), fallback);
      } catch (e) { fallback(); }
      break;
    }
    case 'show-restore': $('#restore-box').hidden = false; $('#restore-text').focus(); break;
    case 'restore': {
      try {
        const p = JSON.parse($('#restore-text').value);
        if (!p || typeof p !== 'object' || !p.log) throw new Error('bad');
        const d = DEFAULTS();
        S = Object.assign(d, p, { settings: Object.assign(d.settings, p.settings || {}) });
        save(); UI.suggestions = null; render(); toast('הנתונים שוחזרו');
      } catch (e) { toast('טקסט הגיבוי אינו תקין. ודאו שהעתקתם אותו במלואו.'); }
      break;
    }
    case 'reset': UI.confirmReset = true; render(); break;
    case 'reset-no': UI.confirmReset = false; render(); break;
    case 'reset-yes':
      S = DEFAULTS(); save(); UI.confirmReset = false; UI.suggestions = null; render(); toast('כל הנתונים נמחקו'); break;
  }
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'food-q') { UI.query = ev.target.value; renderResults(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'prefer-new') { S.settings.preferNew = t.checked; save(); generate(); render(); }
  if (t.id && t.id.startsWith('set-')) {
    const k = t.id.slice(4), v = Math.round(+t.value);
    if (!Number.isFinite(v) || v <= 0) { render(); return; }
    S.settings[k] = v;
    if (S.settings.fiberMax <= S.settings.fiberMin) S.settings.fiberMax = S.settings.fiberMin + 5;
    save(); render(); toast('היעד עודכן');
  }
});
document.addEventListener('keydown', ev => {
  if (ev.target.id === 'food-q' && ev.key === 'Enter') {
    ev.preventDefault();
    const first = $('#results-wrap [data-act="add"]');
    if (first) first.click();
  }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'custom-form') {
    const name = $('#cf-name').value.trim();
    const cat = $('#cf-cat').value;
    const fiber = Math.max(0, Math.min(40, +$('#cf-fiber').value || 0));
    const portion = $('#cf-portion').value.trim() || 'מנה';
    if (!name) return;
    const b = checkBlocked(name);
    if (b) { toast(`"${name}" חסום (${b.label}) ולא נשמר`); return; }
    let f = S.custom.find(x => norm(x.name) === norm(name));
    if (!f) { f = { id: 'c_' + uid(), name, cat, fiber, portion, alias: '' }; S.custom.push(f); if (S.pantry) S.pantry.push(f.id); }
    addEntry(UI.date, f, 1, UI.addMeal); save();
    UI.showCustom = false; UI.query = ''; render();
    toast(`נוסף: ${name} (${g1(fiber)} ג׳)`);
  }
  if (ev.target.id === 'block-form') {
    const w = $('#block-word').value.trim();
    if (!w) return;
    if (!S.settings.extraBlocked.some(x => norm(x) === norm(w))) S.settings.extraBlocked.push(w);
    UI.suggestions = null; save(); render(); toast(`"${w}" נחסם`);
  }
});
window.addEventListener('hashchange', () => { routeFromHash(); render(); });

routeFromHash();
render();
})();
</script>
</body>
</html>
