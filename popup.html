<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Content Guardian</title>
  <style>
    body {
      width: 300px;
      font-family: "Segoe UI", "Assistant", Arial, sans-serif;
      margin: 0;
      padding: 18px;
      background: #f8fafc;
      color: #0f172a;
    }
    h1 { font-size: 17px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 14px; }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e2e8f0;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .on { background: #16a34a; }
    .off { background: #dc2626; }
    .email { font-size: 12px; color: #475569; word-break: break-all; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <h1>🛡️ Content Guardian</h1>
  <div class="sub">חסימת X (טוויטר) ותוכן לא צנוע</div>

  <div class="row">
    <span class="dot off" id="dot"></span>
    <span id="statusText">בודק סטטוס…</span>
  </div>
  <div class="email" id="email"></div>

  <button id="signin" style="margin-top:10px;">אימות מול חשבון Google</button>

  <script src="popup.js"></script>
</body>
</html>
