<!DOCTYPE html>

<body>
<title>טומי הקפצן 3D</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;600&family=Silkscreen&display=swap">
<style>
  /* Layout: full-bleed 3D canvas, HUD strip across the top, centered overlay cards, touch stick + jump on phones.
     Deliberately single-theme (arcade night), all colors explicit. */
  :root {
    --bg: #12142e;
    --ink: #fff7ea;
    --muted: #c9c4e8;
    --accent: #ff8a3d;
    --teal: #2ec4b6;
    --heart: #ff4f6d;
    --display: "Secular One", "Rubik", system-ui, sans-serif;
    --body: "Rubik", system-ui, sans-serif;
    --pixel: "Silkscreen", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  #c { display: block; width: 100%; height: 100%; cursor: grab; }
  #c:active { cursor: grabbing; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    direction: rtl; pointer-events: none; font-family: var(--pixel);
    text-shadow: 0 2px 0 rgba(0,0,0,.55);
    background: linear-gradient(rgba(10,10,30,.45), rgba(10,10,30,0));
  }
  .cell { display: flex; flex-direction: column; align-items: center; line-height: 1.1; min-width: 56px; }
  .cell b { font-family: var(--body); font-weight: 600; font-size: 12px; opacity: .9; }
  .cell span { direction: ltr; unicode-bidi: isolate; font-size: 18px; font-variant-numeric: tabular-nums; }
  #hHearts { color: var(--heart); letter-spacing: 2px; }

  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: rgba(12, 12, 34, .62); padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  }
  #overlay[hidden] { display: none !important; }
  .card { max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .card h1, .card h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
  .card h1 { font-size: clamp(44px, 9vw, 84px); color: var(--accent); text-shadow: 0 4px 0 #7a2c0c, 0 9px 18px rgba(0,0,0,.45); }
  .card h1 em { font-style: normal; color: var(--teal); text-shadow: 0 4px 0 #0f5c55, 0 9px 18px rgba(0,0,0,.45); }
  .card h2 { font-size: clamp(32px, 6vw, 52px); }
  .card .sub { font-size: 17px; color: var(--muted); margin: 0; }
  .card .big { font-family: var(--pixel); font-size: 24px; margin: 0; }
  .keys { display: grid; grid-template-columns: auto auto; gap: 6px 16px; font-size: 15px; text-align: right; }
  .keys kbd { font-family: var(--pixel); background: #2b2f63; border-radius: 4px; padding: 1px 6px; font-size: 13px; }
  body.touch .keys { display: none; }
  .touchhelp { display: none; font-size: 15px; color: var(--muted); }
  body.touch .touchhelp { display: block; }
  .btn-start {
    font-family: var(--display); font-size: 26px; color: #2a1305; background: var(--accent);
    border: 0; border-radius: 6px; padding: 6px 30px; cursor: pointer; box-shadow: 0 4px 0 #9c3e0e;
  }
  .btn-start:focus-visible, .iconbtn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }

  .iconbtn {
    position: absolute; font-family: var(--pixel); font-size: 13px; background: rgba(0,0,0,.4); color: var(--ink);
    border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 4px 9px; cursor: pointer;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  #mute { left: max(16px, env(safe-area-inset-left, 0px)); }
  body.touch #mute { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 64px); }

  /* touch controls */
  #stickBase, #jumpBtn { display: none; }
  body.touch #stickBase { display: block; }
  body.touch #jumpBtn { display: flex; }
  #stickBase {
    position: absolute; width: 120px; height: 120px; border-radius: 50%;
    left: calc(max(16px, env(safe-area-inset-left, 0px)) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); pointer-events: none;
  }
  #stickKnob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(255,255,255,.55);
  }
  #jumpBtn {
    position: absolute; width: 84px; height: 84px; border-radius: 50%; border: 0;
    right: calc(max(16px, env(safe-area-inset-right, 0px)) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 36px);
    background: var(--accent); color: #2a1305; box-shadow: 0 6px 0 #9c3e0e; font-family: var(--body); font-weight: 600; font-size: 17px;
    align-items: center; justify-content: center; touch-action: none;
  }
  #jumpBtn.on { transform: translateY(5px); box-shadow: 0 1px 0 #9c3e0e; }
</style>

<div id="stage">
  <canvas id="c" aria-label="עולם המשחק בתלת־ממד"></canvas>
  <div id="hud">
    <div class="cell"><b>לבבות</b><span id="hHearts">♥♥♥</span></div>
    <div class="cell"><b>ניקוד</b><span id="hScore">000000</span></div>
    <div class="cell"><b>מטבעות</b><span id="hCoins">×00</span></div>
    <div class="cell"><b>עולם</b><span id="hWorld">1/3</span></div>
    <div class="cell"><b>זמן</b><span id="hTime">300</span></div>
    <div class="cell"><b>חיים</b><span id="hLives">×3</span></div>
  </div>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <button id="jumpBtn" type="button" aria-label="קפיצה">קפיצה</button>
  <button id="mute" class="iconbtn" type="button" aria-label="השתקה">♪ ON</button>
  <div id="overlay" dir="rtl"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) {
  $('overlay').innerHTML = '<div class="card"><h2>שגיאה בטעינה</h2><p class="sub">ספריית התלת־ממד לא נטענה. רעננו את הדף.</p></div>';
  return;
}
const V3 = THREE.Vector3;

/* ================= audio ================= */
let actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d = .1, type = 'square', slide = 0, vol = .06, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
}
const seq = (n, s, l = .1) => n.forEach((f, i) => tone(f, l, 'square', 0, .05, i * s));
const sfx = {
  jump: () => tone(300, .16, 'square', 400, .045),
  coin: () => { tone(988, .06, 'square', 0, .045); tone(1319, .2, 'square', 0, .045, .06); },
  stomp: () => tone(260, .14, 'triangle', -180, .14),
  bump: () => tone(130, .1, 'triangle', -40, .14),
  item: () => tone(330, .35, 'triangle', 500, .08),
  power: () => seq([523, 659, 784, 1047], .06),
  hurt: () => tone(600, .35, 'square', -450, .06),
  die: () => seq([494, 440, 392, 330, 262, 196], .13, .14),
  clear: () => seq([523, 659, 784, 1047, 784, 1047, 1319], .11, .14),
  life: () => seq([660, 880, 1320, 1760], .08),
  tick: () => tone(1400, .03, 'square', 0, .02),
  check: () => seq([784, 988, 1175], .07),
};

/* ================= renderer & scene ================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, .1, 400);
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, .75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, .85);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 });
sun.shadow.bias = -.0015;
scene.add(sun, sun.target);

const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshLambertMaterial(Object.assign({ color, flatShading: true }, opts)));
  return matCache.get(key);
}
function mesh(geo, material, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = shadow; m.receiveShadow = true; return m;
}

/* ================= models ================= */
function makeFox() {
  const g = new THREE.Group();
  const O = mat('#f07a2a'), CR = mat('#fff1d6'), DK = mat('#2a1a14'), SC = mat('#2ec4b6'), OD = mat('#c4561a');
  const body = mesh(new THREE.BoxGeometry(.62, .5, .8), O); body.position.set(0, .55, 0); g.add(body);
  const belly = mesh(new THREE.BoxGeometry(.44, .3, .5), CR); belly.position.set(0, .42, .2); g.add(belly);
  const head = new THREE.Group(); head.position.set(0, 1.02, .28); g.add(head);
  head.add(mesh(new THREE.BoxGeometry(.58, .5, .52), O));
  const muz = mesh(new THREE.BoxGeometry(.28, .2, .28), CR); muz.position.set(0, -.08, .36); head.add(muz);
  const nose = mesh(new THREE.BoxGeometry(.1, .08, .06), DK); nose.position.set(0, -.02, .52); head.add(nose);
  for (const s of [-1, 1]) {
    const eye = mesh(new THREE.BoxGeometry(.09, .11, .04), DK, false); eye.position.set(s * .15, .07, .27); head.add(eye);
    const ear = mesh(new THREE.ConeGeometry(.13, .3, 4), O); ear.position.set(s * .18, .38, 0); ear.rotation.y = Math.PI / 4; head.add(ear);
    const earIn = mesh(new THREE.ConeGeometry(.07, .18, 4), OD, false); earIn.position.set(s * .18, .36, .05); earIn.rotation.y = Math.PI / 4; head.add(earIn);
  }
  const scarf = mesh(new THREE.BoxGeometry(.7, .13, .88), SC); scarf.position.set(0, .8, 0); g.add(scarf);
  const scarfTail = mesh(new THREE.BoxGeometry(.12, .1, .45), SC); scarfTail.position.set(.22, .78, -.6); g.add(scarfTail);
  const tail = new THREE.Group(); tail.position.set(0, .62, -.4); g.add(tail);
  const tailM = mesh(new THREE.CylinderGeometry(.06, .2, .7, 6), O); tailM.rotation.x = -Math.PI / 2 - .5; tailM.position.set(0, .15, -.3); tail.add(tailM);
  const tip = mesh(new THREE.SphereGeometry(.12, 6, 4), CR); tip.position.set(0, .32, -.6); tail.add(tip);
  const legs = [];
  for (const [x, z] of [[-.19, .26], [.19, .26], [-.19, -.26], [.19, -.26]]) {
    const pivot = new THREE.Group(); pivot.position.set(x, .32, z);
    const leg = mesh(new THREE.BoxGeometry(.15, .32, .15), DK); leg.position.y = -.16; pivot.add(leg);
    g.add(pivot); legs.push(pivot);
  }
  g.userData = { legs, tail, scarfTail, head, scarfMat: SC };
  return g;
}
function makeBeetle() {
  const g = new THREE.Group();
  const shell = mesh(new THREE.SphereGeometry(.5, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), mat('#6b3fa0'));
  shell.scale.set(1, .9, 1.1); shell.position.y = .12; g.add(shell);
  const stripe = mesh(new THREE.BoxGeometry(.05, .02, 1.05), mat('#4a2873'), false); stripe.position.y = .57; g.add(stripe);
  const head = mesh(new THREE.BoxGeometry(.45, .3, .3), mat('#2a1a3a')); head.position.set(0, .25, .5); g.add(head);
  for (const s of [-1, 1]) {
    const eye = mesh(new THREE.SphereGeometry(.08, 6, 4), mat('#ffffff'), false); eye.position.set(s * .12, .32, .66); g.add(eye);
    const pup = mesh(new THREE.SphereGeometry(.04, 4, 3), mat('#000000'), false); pup.position.set(s * .12, .32, .73); g.add(pup);
  }
  const legs = [];
  for (const z of [-.25, 0, .25]) for (const s of [-1, 1]) {
    const l = mesh(new THREE.BoxGeometry(.3, .08, .08), mat('#2a1a3a')); l.position.set(s * .5, .08, z); g.add(l); legs.push(l);
  }
  g.userData.legs = legs;
  return g;
}
function makeSpiky() {
  const g = new THREE.Group();
  const b = mesh(new THREE.IcosahedronGeometry(.42, 0), mat('#d6334a')); b.position.y = .45; g.add(b);
  const spikeM = mat('#ffe0e6'), cone = new THREE.ConeGeometry(.08, .3, 4);
  const dirs = [[1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, 0, -1], [.7, .7, 0], [-.7, .7, 0], [0, .7, -.7], [.7, 0, -.7], [-.7, 0, -.7], [.6, .6, .6], [-.6, .6, .6]];
  for (const d of dirs) {
    const s = mesh(cone, spikeM); const v = new V3(...d).normalize();
    s.position.set(v.x * .45, .45 + v.y * .45, v.z * .45);
    s.quaternion.setFromUnitVectors(new V3(0, 1, 0), v); g.add(s);
  }
  for (const s of [-1, 1]) { const e = mesh(new THREE.BoxGeometry(.1, .14, .05), mat('#ffffff'), false); e.position.set(s * .14, .55, .4); g.add(e); }
  return g;
}
function makeBat() {
  const g = new THREE.Group();
  const b = mesh(new THREE.SphereGeometry(.28, 8, 6), mat('#3b2b5c')); g.add(b);
  const wings = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.x = s * .2;
    const w = mesh(new THREE.BoxGeometry(.6, .04, .4), mat('#5b4690')); w.position.x = s * .3; piv.add(w); g.add(piv); wings.push(piv);
    const e = mesh(new THREE.SphereGeometry(.05, 4, 3), mat('#ffde59', { emissive: '#ffde59' }), false); e.position.set(s * .1, .06, .25); g.add(e);
    const ear = mesh(new THREE.ConeGeometry(.07, .18, 4), mat('#3b2b5c')); ear.position.set(s * .12, .3, 0); g.add(ear);
  }
  g.userData.wings = wings;
  return g;
}
const coinGeo = new THREE.CylinderGeometry(.32, .32, .08, 14);
const coinMat = new THREE.MeshLambertMaterial({ color: '#ffd23f', emissive: '#7a5200' });
function makeCoin() { const m = mesh(coinGeo, coinMat); m.rotation.x = Math.PI / 2; const g = new THREE.Group(); g.add(m); return g; }
function makeBerry() {
  const g = new THREE.Group();
  const b = mesh(new THREE.SphereGeometry(.32, 10, 8), mat('#e8364f', { emissive: '#3a0010' })); g.add(b);
  const leaf = mesh(new THREE.ConeGeometry(.16, .2, 5), mat('#4caf3a')); leaf.position.y = .32; leaf.rotation.x = Math.PI; g.add(leaf);
  return g;
}

/* ================= levels ================= */
// plats: [x, z, w, d, top]   movers: [x, topY, z, w, d, dx, dy, dz, speed]
// blocks: [x, bottomY, z, 'Q'|'P']   coins: [x, y, z] or lines {a:[x,y,z], b:[x,y,z], n}
// enemies: [type, x, y, z, axis('x'|'z'), range]  (bats: axis = radius)
// spikes: [x, z, w, d, top]

    coins: [{ a: [0, .8, 1], b: [0, .8, -3], n: 4 }, [0, 2.2, -6], { a: [-2, .8, -9], b: [2, .8, -13], n: 5 },
      [3, 2.8, -19], { a: [-2, 3.5, -30], b: [-2, 3.5, -35], n: 3 }, { a: [-4, 2.8, -39], b: [0, 2.8, -39], n: 4 },
      [4, 4.8, -50], [-2, 5.8, -56], { a: [-3, 2.8, -63], b: [3, 2.8, -63], n: 5 }],
    enemies: [['beetle', 0, 0, -12, 'x', 2.2], ['beetle', -2, 2, -43, 'x', 2.6], ['beetle', -3, 2, -67, 'z', 3], ['beetle', 3, 2, -66, 'x', 1.5]],

      grass: '#d8a648', dirt: '#b65a3c', stone: '#a67d6c', water: '#c0504a', deco: 'rock', hills: '#c4706a' },

    blocks: [[0, 3, -9, 'Q'], [-5, 7, -57, 'P'], [-1.5, 9, -80, 'Q'], [1.5, 9, -80, 'Q']],
    coins: [{ a: [0, 1.3, -14], b: [0, 1.3, -16], n: 2 }, { a: [0, 2.5, -21], b: [0, 2.5, -26], n: 4 }, [5, 2.8, -38], [0, 3.8, -43], [-5, 4.8, -48],
      { a: [-5, 5, -61], b: [-5, 8, -66], n: 4 }, { a: [-3, 6.8, -78], b: [3, 6.8, -78], n: 5 }],
    enemies: [['beetle', -2.6, 1, -31, 'z', 2], ['spiky', 2.6, 1, -31, 'z', 2], ['beetle', -5, 4, -58, 'x', 2], ['spiky', 0, 6, -81, 'x', 3.2], ['beetle', 2, 6, -84, 'z', 1.2]],

    start: [0, 0, 2],

      ['spiky', 0, 5, -74, 'x', 3], ['bat', 0, 7.5, -71, 3, 0]],

/* ================= game state ================= */
const G = { state: 'title', level: 0, score: 0, coins: 0, lives: 3, hearts: 3, time: 300, timeAcc: 0, timer: 0, checkpoint: null, combo: 0, t: 0 };
let world = null, pal;
let solids = [], movers = [], coins = [], enemies = [], spikes = [], items = [], fx = [];
let checkFlag = null, portal = null;
const R = .36, H = 1.3;
const player = { pos: new V3(), vel: new V3(), ground: null, coyote: 0, buffer: 0, inv: 0, yaw: 0, anim: 0, scale: 1 };
const fox = makeFox();
scene.add(fox);
const cam = { yaw: 0, pitch: .42, dist: 9.5, pos: new V3(0, 5, 10), look: new V3() };

function setBox(s, cx, cy, cz) {
  s.c.set(cx, cy, cz);
  s.min.set(cx - s.size.x / 2, cy - s.size.y / 2, cz - s.size.z / 2);
  s.max.set(cx + s.size.x / 2, cy + s.size.y / 2, cz + s.size.z / 2);
  s.mesh.position.set(cx, cy, cz);
}
function addSolid(cx, cy, cz, w, h, d, material) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), material);
  world.add(m);
  const s = { c: new V3(), size: new V3(w, h, d), min: new V3(), max: new V3(), mesh: m };
  setBox(s, cx, cy, cz); solids.push(s); return s;
}

function buildLevel(i) {
  if (world) scene.remove(world);
  world = new THREE.Group(); scene.add(world);
  const L = LEVELS[i]; pal = L.pal;
  solids = []; movers = []; coins = []; enemies = []; spikes = []; items = []; fx = [];
  scene.background = new THREE.Color(pal.sky);
  scene.fog = new THREE.Fog(pal.sky, pal.fog[0], pal.fog[1]);
  hemi.color.set(pal.light); hemi.groundColor.set(pal.ground);
  sun.color.set(pal.sun); sun.intensity = pal.sunI;

  const grassM = mat(pal.grass), dirtM = mat(pal.dirt), stoneM = mat(pal.stone);
  const plMats = [dirtM, dirtM, grassM, dirtM, dirtM, dirtM];
  for (const [x, z, w, d, top] of L.plats) {
    const h = 3 + (top > 3 ? 1.5 : 0);
    addSolid(x, top - h / 2, z, w, h, d, plMats);
    // grass lip
    const lip = mesh(new THREE.BoxGeometry(w + .12, .22, d + .12), grassM); lip.position.set(x, top - .11, z); world.add(lip);
    // underside taper for floating-island look
    const under = mesh(new THREE.CylinderGeometry(Math.min(w, d) * .45, .3, 3, 6), dirtM, false);
    under.position.set(x, top - h - 1.5, z); world.add(under);
    decorate(x, z, w, d, top);
  }
  for (const [x, y, z, w, d, dx, dy, dz, speed] of L.movers) {
    const s = addSolid(x, y - .3, z, w, .6, d, stoneM);
    const rim = mesh(new THREE.BoxGeometry(w - .3, .08, d - .3), mat('#ffffff', { transparent: true, opacity: .35 }), false);
    rim.position.y = .32; s.mesh.add(rim);
    s.mover = { base: new V3(x, y - .3, z), dir: new V3(dx, dy, dz), speed, t: 0, delta: new V3() };
    movers.push(s);
  }
  for (const [x, by, z, type] of L.blocks) {
    const gem = mat(pal.night ? '#7fe3ff' : '#f4b733', { emissive: pal.night ? '#0c3f55' : '#4a2c00' });
    const s = addSolid(x, by + .5, z, 1, 1, 1, gem);
    const deco = new THREE.Group();
    const og = new THREE.OctahedronGeometry(.22, 0);
    for (const [px, pz] of [[.5, 0], [-.5, 0], [0, .5], [0, -.5]]) {
      const o = new THREE.Mesh(og, mat('#ffffff', { emissive: '#666666' })); o.position.set(px, 0, pz);
      o.scale.set(px ? .25 : 1, 1, pz ? .25 : 1); deco.add(o);
    }
    s.mesh.add(deco);
    s.block = { type, used: false, bump: 0, baseY: by + .5, deco };
  }
  const addCoin = (x, y, z) => { const c = makeCoin(); c.position.set(x, y, z); world.add(c); coins.push(c); };
  for (const c of L.coins) {
    if (Array.isArray(c)) addCoin(...c);
    else for (let k = 0; k < c.n; k++) { const f = c.n === 1 ? 0 : k / (c.n - 1); addCoin(c.a[0] + (c.b[0] - c.a[0]) * f, c.a[1] + (c.b[1] - c.a[1]) * f, c.a[2] + (c.b[2] - c.a[2]) * f); }
  }
  for (const [type, x, y, z, axis, range] of L.enemies) spawnEnemy(type, x, y, z, axis, range);
  for (const [x, z, w, d, top] of L.spikes) {
    const g = new THREE.Group(), cone = new THREE.ConeGeometry(.17, .55, 4), sm = mat('#dfe2ee');
    for (let ix = 0; ix < w * 2; ix++) for (let iz = 0; iz < d * 2; iz++) {
      const c = mesh(cone, sm); c.position.set(x - w / 2 + .25 + ix * .5, top + .27, z - d / 2 + .25 + iz * .5); g.add(c);
    }
    world.add(g);
    spikes.push({ min: new V3(x - w / 2, top, z - d / 2), max: new V3(x + w / 2, top + .45, z + d / 2) });
  }
  // checkpoint flag
  checkFlag = new THREE.Group();
  const pole = mesh(new THREE.CylinderGeometry(.06, .06, 2.4, 6), mat('#5a4636')); pole.position.y = 1.2; checkFlag.add(pole);
  const flag = mesh(new THREE.BoxGeometry(.8, .5, .05), mat('#9a95b8')); flag.position.set(.42, 2.1, 0); checkFlag.add(flag);
  checkFlag.userData.flag = flag;
  checkFlag.position.set(L.check[0] + 2.5, L.check[1], L.check[2]);
  world.add(checkFlag);
  // portal
  portal = new THREE.Group();
  const ring = mesh(new THREE.TorusGeometry(1.35, .22, 8, 28), mat('#8e7cff', { emissive: '#3b2a99' })); ring.position.y = 1.6; portal.add(ring);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1.2, 28), new THREE.MeshBasicMaterial({ color: '#7fe3ff', transparent: true, opacity: .55, side: THREE.DoubleSide }));
  disc.position.y = 1.6; portal.add(disc);
  const swirl = new THREE.Mesh(new THREE.TorusGeometry(.7, .06, 6, 20, Math.PI * 1.4), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
  swirl.position.set(0, 1.6, .02); portal.add(swirl);
  for (const s of [-1, 1]) { const p = mesh(new THREE.BoxGeometry(.4, .5, .6), mat(pal.stone)); p.position.set(s * 1.35, .25, 0); portal.add(p); }
  portal.userData = { disc, swirl };
  portal.position.set(...L.goal);
  world.add(portal);
  // backdrop
  if (pal.water) {
    const water = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: pal.water }));
    water.rotation.x = -Math.PI / 2; water.position.y = -9; world.add(water);
  }
  const hillM = mat(pal.hills);
  for (let k = 0; k < 26; k++) {
    const a = k / 26 * Math.PI * 2, r = 70 + (k * 37) % 30;
    const h = 14 + (k * 53) % 22;
    const hill = new THREE.Mesh(new THREE.ConeGeometry(10 + (k * 13) % 9, h, 6), hillM);
    hill.position.set(Math.cos(a) * r, -9 + h / 2, -40 + Math.sin(a) * r); world.add(hill);
  }
  if (pal.night) {
    const sg = new THREE.BufferGeometry(), pts = [];
    for (let k = 0; k < 400; k++) { const a = Math.random() * Math.PI * 2, e = Math.random() * .9 + .05, r = 150; pts.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r - 40); }
    sg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    world.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: '#e9e6ff', size: .8, fog: false })));
    const moon = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 12), new THREE.MeshBasicMaterial({ color: '#f3f0d7', fog: false }));
    moon.position.set(-40, 50, -140); world.add(moon);
  } else {
    const cm = mat('#ffffff', { emissive: '#bbbbbb' });
    for (let k = 0; k < 14; k++) {
      const cl = new THREE.Group();
      for (let j = 0; j < 4; j++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(2 + (j % 2), 0), cm); s.position.set(j * 2.2, (j % 2) * 1, 0); cl.add(s); }
      cl.position.set(-60 + (k * 41) % 120, 18 + (k * 7) % 14, 20 - k * 12); world.add(cl);
    }
  }
}

function decorate(x, z, w, d, top) {
  if (w < 6 || d < 6) return;
  const corners = [[x - w / 2 + .8, z - d / 2 + .8], [x + w / 2 - .8, z + d / 2 - .8]];
  for (const [cx, cz] of corners) {
    const g = new THREE.Group(); g.position.set(cx, top, cz);
    if (pal.deco === 'tree') {
      const trunk = mesh(new THREE.CylinderGeometry(.15, .2, 1, 6), mat('#7d4829')); trunk.position.y = .5; g.add(trunk);
      const c1 = mesh(new THREE.ConeGeometry(.8, 1.4, 7), mat('#2f8f45')); c1.position.y = 1.5; g.add(c1);
      const c2 = mesh(new THREE.ConeGeometry(.6, 1.1, 7), mat('#3fae55')); c2.position.y = 2.2; g.add(c2);
    } else if (pal.deco === 'rock') {
      const r = mesh(new THREE.DodecahedronGeometry(.6, 0), mat('#8e5a4a')); r.position.y = .4; r.scale.y = 1.5; g.add(r);
      const cac = mesh(new THREE.CylinderGeometry(.16, .16, 1.2, 6), mat('#4f8a46')); cac.position.set(.7, .6, .3); g.add(cac);
    } else {
      for (let k = 0; k < 3; k++) {
        const c = mesh(new THREE.OctahedronGeometry(.3 + k * .1, 0), mat('#7fe3ff', { emissive: '#1a6f8f' }));
        c.position.set((k - 1) * .35, .4 + k * .15, 0); c.scale.y = 2; g.add(c);
      }
    }
    world.add(g);
  }
}

function spawnEnemy(type, x, y, z, axis, range) {
  const m = type === 'beetle' ? makeBeetle() : type === 'spiky' ? makeSpiky() : makeBat();
  m.position.set(x, y, z); world.add(m);
  enemies.push({ type, m, base: new V3(x, y, z), axis, range, t: Math.random() * 6, dead: false, deadT: 0,
    r: type === 'bat' ? .45 : .5, h: type === 'spiky' ? .9 : type === 'bat' ? .5 : .65, pos: new V3(x, y, z), prev: new V3(x, y, z) });
}

function startLevel(useCheck) {
  buildLevel(G.level);
  const L = LEVELS[G.level];
  const sp = useCheck && G.checkpoint ? G.checkpoint : L.start;
  player.pos.set(sp[0], sp[1] + .01, sp[2]);
  player.vel.set(0, 0, 0); player.ground = null; player.inv = 0; player.yaw = Math.PI; player.scale = 1;
  G.hearts = 3; G.time = 300; G.timeAcc = 0; G.combo = 0;
  if (useCheck && G.checkpoint) markCheck();
  else G.checkpoint = null;
  cam.yaw = 0;
  snapCamera();
  G.state = 'intro'; G.timer = 1.8;
  showOverlay(`<div class="card"><p class="sub">עולם ${G.level + 1}</p><h2>${L.name}</h2><p class="big">× ${G.lives}</p></div>`);
}
function markCheck() { checkFlag.userData.flag.material = mat('#2ec4b6', { emissive: '#0d4a44' }); }
function newGame() { Object.assign(G, { level: 0, score: 0, coins: 0, lives: 3, checkpoint: null }); startLevel(false); }

/* ================= input ================= */
const keys = { up: false, down: false, left: false, right: false, jump: false, camL: false, camR: false, start: false, pause: false };
const prevKeys = { ...keys }, pressed = {};
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', KeyZ: 'jump', KeyQ: 'camL', KeyE: 'camR', Enter: 'start', KeyP: 'pause', Escape: 'pause',
};
addEventListener('keydown', e => {
  audio();
  if (e.code === 'KeyM') { toggleMute(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; stick.x = stick.y = 0; if (G.state === 'play') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pause(); });

const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

// pointer: joystick (left-bottom zone on touch), camera drag elsewhere
const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
const drag = { id: null, x: 0 };
const base = $('stickBase'), knob = $('stickKnob');
canvas.addEventListener('pointerdown', e => {
  audio();
  if (isTouch && e.clientX < innerWidth * .45 && e.clientY > innerHeight * .35 && stick.id === null) {
    stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY;
    base.style.left = (e.clientX - 60) + 'px'; base.style.top = (e.clientY - 60) + 'px'; base.style.bottom = 'auto';
  } else if (drag.id === null) { drag.id = e.pointerId; drag.x = e.clientX; }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) {
    let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const l = Math.hypot(dx, dy), max = 50;
    if (l > max) { dx *= max / l; dy *= max / l; }
    stick.x = dx / max; stick.y = dy / max;
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
  } else if (e.pointerId === drag.id) {
    cam.yaw -= (e.clientX - drag.x) * .008; drag.x = e.clientX;
  }
});
const endPtr = e => {
  if (e.pointerId === stick.id) {
    stick.id = null; stick.x = stick.y = 0; knob.style.transform = '';
    base.style.left = ''; base.style.top = ''; base.style.bottom = '';
  }
  if (e.pointerId === drag.id) drag.id = null;
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
const jb = $('jumpBtn');
jb.addEventListener('pointerdown', e => { e.preventDefault(); audio(); keys.jump = true; jb.classList.add('on'); try { jb.setPointerCapture(e.pointerId); } catch (_) {} });
const jUp = e => { e.preventDefault(); keys.jump = false; jb.classList.remove('on'); };
jb.addEventListener('pointerup', jUp); jb.addEventListener('pointercancel', jUp); jb.addEventListener('lostpointercapture', jUp);
jb.addEventListener('contextmenu', e => e.preventDefault());
$('overlay').addEventListener('pointerdown', e => {
  audio();
  if (['title', 'over', 'win', 'paused'].includes(G.state)) { e.preventDefault(); pressed.tap = true; }
});
function toggleMute() { muted = !muted; $('mute').textContent = muted ? '♪ OFF' : '♪ ON'; }
$('mute').addEventListener('click', e => { audio(); toggleMute(); e.currentTarget.blur(); });

/* ================= physics ================= */
function overlaps(p, s) {
  return p.x - R < s.max.x && p.x + R > s.min.x && p.z - R < s.max.z && p.z + R > s.min.z &&
         p.y < s.max.y - 1e-4 && p.y + H > s.min.y + 1e-4;
}
function sweep(axis, d) {
  const p = player.pos;
  p[axis] += d;
  let hit = null;
  for (const s of solids) {
    if (!overlaps(p, s)) continue;
    if (axis === 'y') {
      if (d <= 0) { p.y = s.max.y; player.vel.y = 0; hit = s; }
      else { p.y = s.min.y - H; player.vel.y = 0; if (s.block) bumpBlock(s); }
    } else {
      if (d > 0) p[axis] = s.min[axis] - R; else if (d < 0) p[axis] = s.max[axis] + R;
      player.vel[axis] = 0;
    }
  }
  return hit;
}

function bumpBlock(s) {
  const b = s.block; b.bump = .25;
  if (b.used) { sfx.bump(); return; }
  b.used = true; s.mesh.material = mat('#8c6a4c'); s.mesh.remove(b.deco);
  sfx.bump();
  for (const e of enemies) if (!e.dead && Math.abs(e.pos.x - s.c.x) < .9 && Math.abs(e.pos.z - s.c.z) < .9 && Math.abs(e.pos.y - s.max.y) < .3) killEnemy(e);
  if (b.type === 'Q') {
    addCoin();
    const c = makeCoin(); c.position.set(s.c.x, s.max.y + .3, s.c.z); world.add(c);
    fx.push({ m: c, t: 0, dur: .55, kind: 'coinpop', y0: s.max.y + .3 });
  } else {
    sfx.item();
    const b2 = makeBerry(); b2.position.set(s.c.x, s.max.y - .4, s.c.z); world.add(b2);
    items.push({ m: b2, rise: .8, y: s.max.y + .4 });
  }
}

function addScore(n) { G.score += n; }
function addCoin() {
  G.coins++; addScore(100); sfx.coin();
  if (G.coins >= 100) { G.coins -= 100; G.lives++; sfx.life(); }
}
function sparkle(pos, color, n = 8) {
  for (let k = 0; k < n; k++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(.12, .12, .12), new THREE.MeshBasicMaterial({ color }));
    m.position.copy(pos); world.add(m);
    fx.push({ m, t: 0, dur: .6, kind: 'spark', v: new V3((Math.random() - .5) * 5, Math.random() * 5 + 1, (Math.random() - .5) * 5) });
  }
}
function killEnemy(e, squash) {
  e.dead = true; e.deadT = squash ? .5 : 1.2; e.squash = squash; e.vy = 6;
  addScore(squash ? 100 * Math.min(8, 2 ** G.combo) : 200);
  sparkle(e.pos.clone().add(new V3(0, .4, 0)), '#ffffff', 6);
}
function hurt(from) {
  if (player.inv > 0 || G.state !== 'play') return;
  G.hearts--; player.inv = 1.4;
  if (G.hearts <= 0) { die(); return; }
  sfx.hurt();
  const away = player.pos.clone().sub(from); away.y = 0;
  if (away.lengthSq() < .01) away.set(0, 0, 1);
  away.normalize().multiplyScalar(6);
  player.vel.set(away.x, 7, away.z); player.ground = null;
}
function die() { G.state = 'dying'; G.timer = 1.8; player.vel.set(0, 9, 0); sfx.die(); }

function updateMovers(dt) {
  for (const s of movers) {
    const m = s.mover; m.t += dt;
    const f = (1 - Math.cos(m.t * m.speed)) / 2;
    const ox = s.c.x, oy = s.c.y, oz = s.c.z;
    setBox(s, m.base.x + m.dir.x * f, m.base.y + m.dir.y * f, m.base.z + m.dir.z * f);
    m.delta.set(s.c.x - ox, s.c.y - oy, s.c.z - oz);
  }
}

function updatePlayer(dt) {
  // input in camera space
  let ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0) + stick.x;
  let iz = (keys.up ? 1 : 0) - (keys.down ? 1 : 0) - stick.y;
  const il = Math.hypot(ix, iz); if (il > 1) { ix /= il; iz /= il; }
  const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
  const wx = ix * cy - iz * sy, wz = -ix * sy - iz * cy;
  const speed = 6.8, onG = !!player.ground;
  const k = Math.min(1, dt * (onG ? 12 : 4.5));
  player.vel.x += (wx * speed - player.vel.x) * k;
  player.vel.z += (wz * speed - player.vel.z) * k;
  if (Math.hypot(wx, wz) > .1) {
    const target = Math.atan2(wx, wz);
    let d = target - player.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
    player.yaw += d * Math.min(1, dt * 14);
  }
  player.coyote = onG ? .1 : player.coyote - dt;
  player.buffer = pressed.jump ? .14 : player.buffer - dt;
  if (player.buffer > 0 && player.coyote > 0) {
    player.vel.y = 11.5; player.buffer = 0; player.coyote = 0; player.ground = null; sfx.jump();
  }
  const g = (player.vel.y > 0 && keys.jump) ? 22 : 36;
  player.vel.y = Math.max(player.vel.y - g * dt, -24);

  if (player.ground && player.ground.mover) player.pos.add(player.ground.mover.delta);
  sweep('x', player.vel.x * dt);
  sweep('z', player.vel.z * dt);
  player.ground = sweep('y', player.vel.y * dt);
  if (player.ground) G.combo = 0;
  if (player.inv > 0) player.inv -= dt;
  player.anim += Math.hypot(player.vel.x, player.vel.z) * dt * 2.2;

  // coins
  const cpos = player.pos.clone(); cpos.y += .65;
  for (const c of coins) if (!c.userData.got && c.position.distanceToSquared(cpos) < .85) {
    c.userData.got = true; world.remove(c); addCoin(); sparkle(c.position, '#ffe680', 5);
  }
  coins = coins.filter(c => !c.userData.got);
  // items
  for (const it of items) {
    if (it.rise > 0) { const s = Math.min(it.rise, dt * 2); it.m.position.y += s; it.rise -= s; continue; }
    it.m.position.y = it.y + Math.sin(G.t * 3) * .1; it.m.rotation.y += dt * 2;
    if (it.m.position.distanceToSquared(cpos) < 1) {
      it.got = true; world.remove(it.m); sfx.power();
      if (G.hearts < 3) G.hearts++; else addScore(1000);
      addScore(500); sparkle(it.m.position, '#ff6b8a', 10);
    }
  }
  items = items.filter(i => !i.got);
  // spikes
  for (const s of spikes) {
    const p = player.pos;
    if (p.x + R > s.min.x && p.x - R < s.max.x && p.z + R > s.min.z && p.z - R < s.max.z && p.y < s.max.y && p.y + H > s.min.y) {
      const c = new V3((s.min.x + s.max.x) / 2, s.min.y, (s.min.z + s.max.z) / 2);
      hurt(c); if (G.state === 'play' && player.inv > 1.3) player.vel.y = 9;
    }
  }
  // checkpoint
  const L = LEVELS[G.level];
  if (!G.checkpoint && player.pos.distanceTo(new V3(...L.check)) < 3.2) { G.checkpoint = L.check; markCheck(); sfx.check(); sparkle(checkFlag.position.clone().add(new V3(.4, 2, 0)), '#2ec4b6', 10); }
  // portal
  const pp = portal.position;
  if (Math.hypot(player.pos.x - pp.x, player.pos.z - pp.z) < 1.1 && player.pos.y < pp.y + 3 && player.pos.y > pp.y - .5) {
    G.state = 'clear'; G.timer = 0; G.bonusWait = 1; sfx.clear(); player.vel.set(0, 0, 0);
  }
  if (player.pos.y < -10) die();
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) {
      e.deadT -= dt;
      if (e.squash) { e.m.scale.y = Math.max(.15, e.m.scale.y - dt * 6); }
      else { e.vy -= 25 * dt; e.m.position.y += e.vy * dt; e.m.rotation.x += dt * 8; }
      if (e.deadT <= 0) { world.remove(e.m); e.gone = true; }
      continue;
    }
    e.t += dt;
    e.prev.copy(e.pos);
    if (e.type === 'bat') {
      const a = e.t * 1.1;
      e.pos.set(e.base.x + Math.cos(a) * e.axis, e.base.y + Math.sin(e.t * 2.3) * .5, e.base.z + Math.sin(a) * e.axis);
      e.m.userData.wings.forEach((w, i) => { w.rotation.z = Math.sin(e.t * 18) * .8 * (i ? 1 : -1); });
    } else {
      const sp = e.type === 'spiky' ? .8 : 1.1;
      const off = Math.sin(e.t * sp * 1.2 / Math.max(1, e.range) * 1.6) * e.range;
      e.pos.copy(e.base); e.pos[e.axis] += off;
      if (e.type === 'beetle') e.m.userData.legs.forEach((l, i) => { l.rotation.y = Math.sin(e.t * 12 + i) * .4; });
      else e.m.rotation.x += dt * 2;
    }
    const mv = e.pos.clone().sub(e.prev);
    if (mv.lengthSq() > 1e-6 && e.type !== 'spiky') e.m.rotation.y = Math.atan2(mv.x, mv.z);
    e.m.position.copy(e.pos);
    if (e.type === 'bat') e.m.position.y += .25;

    // vs player
    const dx = player.pos.x - e.pos.x, dz = player.pos.z - e.pos.z;
    if (Math.hypot(dx, dz) < R + e.r && player.pos.y < e.pos.y + e.h && player.pos.y + H > e.pos.y && G.state === 'play') {
      if (e.type !== 'spiky' && player.vel.y < 0 && player.pos.y > e.pos.y + e.h * .45) {
        G.combo++; killEnemy(e, true); sfx.stomp();
        player.vel.y = keys.jump ? 13 : 8.5; player.ground = null;
      } else hurt(e.pos);
    }
  }
  enemies = enemies.filter(e => !e.gone);
}

function updateFx(dt) {
  for (const f of fx) {
    f.t += dt; const k = f.t / f.dur;
    if (f.kind === 'coinpop') { f.m.position.y = f.y0 + Math.sin(k * Math.PI) * 1.6; f.m.rotation.y += dt * 20; }
    else if (f.kind === 'spark') { f.v.y -= 14 * dt; f.m.position.addScaledVector(f.v, dt); f.m.scale.setScalar(1 - k); }
    if (k >= 1) { world.remove(f.m); f.done = true; }
  }
  fx = fx.filter(f => !f.done);
  for (const c of coins) c.rotation.y += dt * 3;
  for (const s of solids) if (s.block && s.block.bump > 0) {
    s.block.bump = Math.max(0, s.block.bump - dt);
    s.mesh.position.y = s.block.baseY + Math.sin((1 - s.block.bump / .25) * Math.PI) * .3;
  }
  if (portal) { portal.userData.swirl.rotation.z -= dt * 3; portal.userData.disc.material.opacity = .45 + Math.sin(G.t * 3) * .12; }
}

/* ================= camera & fox pose ================= */
function camTarget() {
  const p = player.pos;
  const cp = Math.cos(cam.pitch), spch = Math.sin(cam.pitch);
  return {
    pos: new V3(p.x + Math.sin(cam.yaw) * cam.dist * cp, p.y + 1 + cam.dist * spch, p.z + Math.cos(cam.yaw) * cam.dist * cp),
    look: new V3(p.x, p.y + 1.2, p.z),
  };
}
function snapCamera() { const t = camTarget(); cam.pos.copy(t.pos); cam.look.copy(t.look); }
function updateCamera(dt) {
  if (keys.camL) cam.yaw += dt * 2.2;
  if (keys.camR) cam.yaw -= dt * 2.2;
  const t = camTarget();
  const k = Math.min(1, dt * 6);
  cam.pos.lerp(t.pos, k); cam.look.lerp(t.look, Math.min(1, dt * 10));
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
  sun.position.set(player.pos.x + 8, player.pos.y + 20, player.pos.z + 6);
  sun.target.position.copy(player.pos);
}
function poseFox(dt) {
  fox.position.copy(player.pos);
  fox.rotation.y = player.yaw;
  fox.scale.setScalar(player.scale);
  const sp = Math.hypot(player.vel.x, player.vel.z);
  const ud = fox.userData;
  if (player.ground) {
    const sw = Math.sin(player.anim * 3.2) * Math.min(1, sp / 4) * .7;
    ud.legs[0].rotation.x = sw; ud.legs[3].rotation.x = sw; ud.legs[1].rotation.x = -sw; ud.legs[2].rotation.x = -sw;
    fox.children[0].position.y = .55 + Math.abs(Math.sin(player.anim * 3.2)) * .05 * Math.min(1, sp / 3);
  } else {
    ud.legs.forEach((l, i) => { l.rotation.x = i < 2 ? -.6 : .6; });
  }
  ud.tail.rotation.y = Math.sin(G.t * 4) * .3;
  ud.scarfTail.rotation.y = Math.sin(G.t * 9) * .3;
  fox.visible = !(player.inv > 0 && Math.floor(player.inv * 12) % 2);
}

/* ================= state machine ================= */
function pause() { G.state = 'paused'; showOverlay(`<div class="card"><h2>הפסקה</h2><p class="sub blink">P או נגיעה כדי להמשיך</p></div>`); }

function step(dt) {
  G.t += dt;
  for (const k in keys) pressed[k] = keys[k] && !prevKeys[k];
  Object.assign(prevKeys, keys);
  const go = pressed.start || pressed.jump || pressed.tap; pressed.tap = false;
  switch (G.state) {
    case 'title': {
      cam.yaw += dt * .15; updateMovers(dt); updateEnemies(dt); updateFx(dt); poseFox(dt); updateCamera(dt);
      if (go) { hideOverlay(); newGame(); }
      break;
    }
    case 'over': case 'win':
      cam.yaw += dt * .15; updateFx(dt); updateCamera(dt);
      if (go) { hideOverlay(); newGame(); }
      break;
    case 'paused':
      if (pressed.pause || go) { hideOverlay(); G.state = 'play'; }
      break;
    case 'intro':
      G.timer -= dt; updateMovers(dt); updateFx(dt); poseFox(dt); updateCamera(dt);
      if (G.timer <= 0) { hideOverlay(); G.state = 'play'; }
      break;
    case 'play':
      if (pressed.pause) { pause(); break; }
      updateMovers(dt); updatePlayer(dt);
      updateEnemies(dt); updateFx(dt); poseFox(dt); updateCamera(dt);
      if (G.state === 'play') {
        G.timeAcc += dt;
        if (G.timeAcc >= 1) { G.timeAcc -= 1; G.time--; if (G.time <= 0) die(); }
      }
      break;
    case 'dying':
      G.timer -= dt; player.vel.y -= 25 * dt; player.pos.y += player.vel.y * dt;
      fox.rotation.z += dt * 6; fox.position.copy(player.pos);
      updateFx(dt);
      if (G.timer <= 0) {
        fox.rotation.z = 0;
        G.lives--;
        if (G.lives < 0) {
          G.state = 'over';
          showOverlay(`<div class="card"><h2>המשחק נגמר</h2><p class="big">${String(G.score).padStart(6, '0')}</p><button class="btn-start" type="button">שוב</button></div>`);
        } else startLevel(true);
      }
      break;
    case 'clear':
      updateMovers(dt); updateFx(dt);
      player.scale = Math.max(0, player.scale - dt * 1.2); player.yaw += dt * 12;
      player.pos.lerp(portal.position.clone().add(new V3(0, .9, 0)), Math.min(1, dt * 3));
      poseFox(dt); updateCamera(dt);
      if (player.scale <= 0) {
        if (G.time > 0) {
          G.timer += dt;
          while (G.timer > .016 && G.time > 0) { G.timer -= .016; G.time -= 1; G.score += 10; }
          if (Math.floor(G.t * 20) % 2) sfx.tick();
        } else if ((G.bonusWait -= dt) <= 0) {
          G.level++;
          if (G.level >= LEVELS.length) {
            G.state = 'win';
            showOverlay(`<div class="card"><p class="sub">טומי עבר את כל שלושת העולמות</p><h1>ניצחון!</h1><p class="big">${String(G.score).padStart(6, '0')}</p><button class="btn-start" type="button">משחק חדש</button></div>`);
          } else startLevel(false);
        }
      }
      break;
  }
}

/* ================= HUD & overlay ================= */
let hudCache = '';
function updateHud() {
  const s = `${G.score}|${G.coins}|${G.level}|${G.time}|${G.lives}|${G.hearts}`;
  if (s === hudCache) return; hudCache = s;
  $('hScore').textContent = String(G.score).padStart(6, '0');
  $('hCoins').textContent = '×' + String(G.coins).padStart(2, '0');
  $('hWorld').textContent = (G.level + 1) + '/3';
  $('hTime').textContent = String(Math.max(0, G.time)).padStart(3, '0');
  $('hLives').textContent = '×' + Math.max(0, G.lives);
  $('hHearts').textContent = '♥'.repeat(Math.max(0, G.hearts)) + '♡'.repeat(3 - Math.max(0, G.hearts));
}
function showOverlay(html) {
  const o = $('overlay'); o.innerHTML = html; o.hidden = false;
  const b = o.querySelector('.btn-start');
  if (b) b.addEventListener('click', () => { audio(); pressed.tap = true; });
}
function hideOverlay() { $('overlay').hidden = true; }
function showTitle() {
  showOverlay(`<div class="card">
    <h1>טומי הקפצן <em>3D</em></h1>
    <p class="sub">שלושה עולמות של איים מרחפים. קפצו על אויבים, הכו בקוביות קריסטל מלמטה והגיעו לשער הזוהר.</p>
    <div class="keys">
      <span><kbd>W A S D</kbd> / <kbd>חיצים</kbd></span><span>תנועה</span>
      <span><kbd>רווח</kbd></span><span>קפיצה (החזיקו לקפיצה גבוהה)</span>
      <span><kbd>Q</kbd> <kbd>E</kbd> / גרירת עכבר</span><span>סיבוב המצלמה</span>
      <span><kbd>P</kbd> · <kbd>M</kbd></span><span>הפסקה · השתקה</span>
    </div>
    <p class="touchhelp">ג׳ויסטיק בצד שמאל למטה, כפתור קפיצה מימין. גררו בשאר המסך כדי לסובב את המצלמה.</p>
    <button class="btn-start" type="button">התחלה</button>
  </div>`);
}

/* ================= loop ================= */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 72 : 58;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

G.level = 0; buildLevel(0);
const L0 = LEVELS[0]; player.pos.set(...L0.start); player.yaw = Math.PI;
cam.dist = 11; snapCamera(); cam.dist = 9.5;
showTitle();

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  step(dt);
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
